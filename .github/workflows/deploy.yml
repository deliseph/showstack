name: deploy

# The site's single real deployment is the Vercel project "showstack"
# (showstack-inky.vercel.app), which builds from this repo on every push.
# This workflow no longer publishes a second copy: it publishes a redirect,
# so old deliseph.github.io/showstack links keep resolving to the one app
# instead of serving a stale duplicate with its own canonicals.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build the redirect pages
        run: |
          mkdir -p dist
          cat > dist/404.html << 'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>showstack has moved</title>
          <link rel="canonical" href="https://showstack-inky.vercel.app/">
          <script>
            var p = location.pathname.replace(/^\/showstack/, "");
            location.replace("https://showstack-inky.vercel.app" + p + location.search + location.hash);
          </script>
          <p>showstack now lives at <a href="https://showstack-inky.vercel.app/">showstack-inky.vercel.app</a>.</p>
          HTML
          cp dist/404.html dist/index.html
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
