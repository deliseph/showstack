id: hdmi-specification
designation: HDMI Specification 2.2
title: High-Definition Multimedia Interface Specification Version 2.2
body: HDMI Forum
domain: video
year: 2025
scope: >-
  Defines the HDMI interface: TMDS/FRL signalling, connector pinout and
  types, the audio/video protocols it carries, the EDID and HDMI-CEC
  control channels, and (from 2.1 onward) the higher-bandwidth modes such
  as Dynamic HDR and higher resolution/refresh-rate combinations. Each
  version number describes the maximum a source, sink, or cable can do —
  the connector shape alone never tells you which version a given port or
  cable actually supports.
status: current
