  url: https://www.hdmi.org/spec/hdmi2_1
  label: HDMI Forum specification overview (full text via Adopter Extranet)
jurisdiction:
  - International
notes: >-
  Released 25 June 2025 by the HDMI Forum's Technical Working Group,
  raising maximum bandwidth to 96 Gbit/s over a new "Ultra96" cable and
  FRL lane structure. The HDMI Forum, Inc. develops and releases the
  technical specification; HDMI Licensing Administrator, Inc. (HDMI LA)
  is the separate entity appointed as licensing agent, handling trademark
  and compliance licensing for adopters. Full specification text requires
  signing the (no-cost) HDMI Adopter Agreement, not a cash purchase, but
  is not a public download.
confidence: verified
