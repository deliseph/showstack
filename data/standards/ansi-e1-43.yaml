id: ansi-e1-43
designation: ANSI E1.43-2025
title: Entertainment Technology - Performer Flying Systems
body: ESTA
domain: machinery
year: 2025
scope: >-
  Minimum performance parameters for the design, manufacture, use, and
  maintenance of performer flying systems in entertainment production. The 2016
  edition covered mechanical systems supporting airborne performers or ride-on
  props and excluded flying members of the public, fall protection systems, and
  aerial acts that depend on the performer's own strength.
status: current
