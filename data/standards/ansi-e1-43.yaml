notes: >-
  The 2025 edition is a substantial revision of the 2016 text. ESTA hosts the
  2016 edition as a free PDF at
  https://tsp.esta.org/tsp/documents/docs/ANSI_E1-43--2016_PerformerFlyingSystems.pdf,
  but free availability of the 2025 edition was not confirmed, so free_to_read
  is deliberately omitted here rather than guessed. Powered hoists that are not
  lifting performers fall under ANSI E1.6-1 instead.
