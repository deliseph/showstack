notes: >-
  Second edition, dated 1994-11-15, reviewed and confirmed in 2000; ISO's
  own catalogue still lists this as the current version with no later
  edition published. It replaced the first edition, ISO 7498:1984.
  Companion parts in the same family — 7498-2 (security architecture),
  7498-3 (naming and addressing), 7498-4 (management framework) — cover
  material this basic-model part does not.
