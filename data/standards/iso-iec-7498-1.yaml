id: iso-iec-7498-1
designation: ISO/IEC 7498-1:1994
title: >-
  Information technology - Open Systems Interconnection - Basic Reference
  Model: The Basic Model
body: ISO/IEC
domain: networking
year: 1994
scope: >-
  Defines the seven-layer OSI reference model — physical, data link,
  network, transport, session, presentation, and application — as an
  abstract framework for describing how open systems communicate. It does
  not define any wire protocol itself; it is the layer vocabulary
  ("layer 2", "layer 3") that networking documentation on show networks
  borrows, even though almost no real protocol stack, including TCP/IP,
  maps onto all seven layers cleanly.
