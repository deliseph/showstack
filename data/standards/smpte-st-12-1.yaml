id: smpte-st-12-1
designation: SMPTE ST 12-1:2014
title: Time and Control Code
body: SMPTE
domain: control-data
year: 2014
scope: >-
  Defines the time and control code used by television and audio systems at 60,
  59.94, 50, 48, 47.95, 30, 29.97, 25, 24, and 23.98 frames per second. It
  specifies the structure of the time address, binary groups, and flag bits,
  and two carriers: linear time code (LTC) for recording on linear media or a
  serial interface, and vertical interval time code (VITC).
status: current
