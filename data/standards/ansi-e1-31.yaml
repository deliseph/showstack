id: ansi-e1-31
designation: ANSI E1.31-2018
title: Lightweight streaming protocol for transport of DMX512 using ACN
body: ESTA
domain: control-data
year: 2018
scope: >-
  Defines how DMX512 data is packaged into the ACN root layer and streamed over
  IPv4 and IPv6 networks, including universe-to-multicast-address mapping,
  source priority, synchronisation packets, and universe discovery.
