id: iec-62471-5
designation: IEC 62471-5:2015
title: >-
  Photobiological safety of lamps and lamp systems - Part 5: Image
  projectors
body: IEC
domain: laser
year: 2015
scope: >-
  Defines a risk group classification system (RG1, RG2, RG3) and the
  measurement conditions for optical radiation emitted by image
  projectors — theatre projectors, data projectors, and home-use
  projectors — regardless of whether the light source is a lamp, LED, or
  laser. This is the part of the 62471 series that actually governs
  projector risk-group labelling; the base IEC 62471 document covers
  general lamps and lamp systems and explicitly excludes projection uses
  from its own scope.
