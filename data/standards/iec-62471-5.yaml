notes: >-
  Edition 1.0, published 9 June 2015, developed by TC 76 (Optical
  radiation safety and laser equipment), stability date 2027. Often cited
  loosely alongside IEC 60825-1 as "IEC/EN 62471" for laser-illuminated
  projectors: 60825-1 classifies the laser diodes as a source, while this
  part classifies the projected output an audience is actually exposed
  to, measured at a defined projection ratio (2.0:1 for interchangeable
  optics). A European harmonised EN 62471-5 also exists.
