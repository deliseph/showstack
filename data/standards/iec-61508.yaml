notes: >-
  Edition 2.0, published 30 April 2010. This is where the Safety Integrity
  Level concept comes from, which is why stage machinery control specifications
  quote SIL ratings for emergency stops and load monitoring. A SIL number on a
  machinery data sheet is a claim about the whole safety function, not about a
  single component, so ask what function was assessed.
