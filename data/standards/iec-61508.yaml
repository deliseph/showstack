id: iec-61508
designation: IEC 61508-1:2010
title: >-
  Functional safety of electrical/electronic/programmable electronic
  safety-related systems - Part 1: General requirements
body: IEC
domain: machinery
year: 2010
scope: >-
  Part 1 of the seven-part IEC 61508 series. It sets out the overall safety
  lifecycle and the general requirements for electrical, electronic, and
  programmable electronic systems that carry out safety functions, and it is
  the basic safety publication from which sector-specific functional safety
  standards are derived.
status: current
