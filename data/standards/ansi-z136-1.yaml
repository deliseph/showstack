notes: IEC 60825-1 classifies the product; Z136.1 governs how you may operate it and who is
  responsible. A US show laser also has to satisfy the FDA/CDRH requirements in 21 CFR 1040
  and, for audience scanning, a variance. Three separate hurdles, commonly confused for one.
