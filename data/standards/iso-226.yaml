id: iso-226
designation: ISO 226
title: Acoustics — Normal equal-loudness-level contours
body: ISO
domain: audio
year: 2023
scope: >-
  Defines the equal-loudness contours: the sound pressure level required at each frequency for a
  pure tone to be judged as loud as a reference tone at 1 kHz. The modern replacement for the Fletcher–Munson
  curves.
status: current
free_to_read: false
access_url:
  url: https://www.iso.org/standard/83117.html
  label: ISO
notes: >-
  The reason a mix balanced at show level sounds thin at rehearsal level, and the basis of the A-weighting
  used in every noise-exposure measurement.
