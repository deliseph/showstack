id: etsi-en-300-422-1
designation: ETSI EN 300 422-1
title: 'Wireless microphones; Audio PMSE up to 3 GHz; Part 1: Class A Receivers'
body: ETSI
domain: audio
year: 2017
scope: >-
  The harmonised standard for professional wireless microphone and in-ear equipment in Europe: transmitter
  masks, receiver performance classes and the spectrum-efficiency requirements. Later revisions
  add the transmit mask and 20 MHz bandwidth ceiling that make Wireless Multichannel Audio Systems
  (WMAS) legal.
