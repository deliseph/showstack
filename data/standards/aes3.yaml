id: aes3
designation: AES3-2009 (r2019)
title: AES standard for digital audio - Digital input-output interfacing - Serial transmission
  format for two-channel linearly represented digital audio data
body: AES
domain: audio
year: 2009
scope: 'AES/EBU: two channels of linear PCM on one balanced 110 ohm pair, self-clocking, with
  status and user bits alongside the samples. The consumer S/PDIF interface is the same data
  on different electricals.'
status: current
free_to_read: false
access_url:
  url: https://www.aes.org/publications/standards/search.cfm?docID=13
  label: AES Standards Store
jurisdiction:
