id: iec-62368-1
designation: IEC 62368-1:2023
title: 'Audio/video, information and communication technology equipment - Part 1: Safety requirements'
body: IEC
domain: electrical
year: 2023
scope: The hazard-based safety standard that replaced IEC 60065 (audio/video) and IEC 60950-1
  (IT equipment). Classifies energy sources rather than listing constructions, so it applies
  to consoles, media servers, amplifiers, network gear and anything else in a rack.
status: current
