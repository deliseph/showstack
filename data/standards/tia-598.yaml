notes: >-
  Published 9 July 2014 as a revision of TIA-598-C (2005), with Addendum
  1 and Addendum 2 (both 2018) adding a jacket colour for OM5 wideband
  multimode fibre. As of TIA's own June 2023 published standards-revision
  list, a further -E revision was still "work in progress"; no published
  -E edition has been found since, so -D with its addenda remains the
  current text.
