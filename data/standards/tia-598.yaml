id: tia-598
designation: ANSI/TIA-598-D
title: Optical Fiber Cable Color Coding
body: TIA
domain: networking
year: 2014
scope: >-
  Defines the jacket and print colour convention used to identify optical
  fibre type by sight: colours such as orange, aqua, and erika violet for
  the various multimode grades (OM1-OM4), and yellow for single-mode
  (OS1/OS2), plus codes for buffered fibres and connector strain-relief
  boots. It is an industry naming convention, not a physical property of
  the glass, so an unlabelled or repurposed cable has to be confirmed
  against its printed spec rather than assumed from jacket colour alone.
status: current
