id: ansi-e1-20
designation: ANSI E1.20-2025
title: Entertainment Technology - Remote Device Management over DMX512 Networks (RDM)
body: ESTA
domain: control-data
year: 2025
scope: >-
  Adds bidirectional communication to a DMX512 line so a controller can
  discover devices, read and set DMX start addresses, query sensors, and
  collect status messages, using an alternate start code so that it shares the
  cable with ordinary DMX512 traffic.
status: current
