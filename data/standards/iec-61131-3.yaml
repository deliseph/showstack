title: 'Programmable controllers — Part 3: Programming languages'
body: IEC
domain: machinery
year: 2013
scope: >-
  Defines the five programming languages used on programmable logic controllers — Structured Text,
  Ladder Diagram, Function Block Diagram, Sequential Function Chart and Instruction List — together
  with a common data type and program organisation model.
status: current
