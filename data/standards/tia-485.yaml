id: tia-485
designation: ANSI/TIA-485-A
title: >-
  Electrical Characteristics of Generators and Receivers for Use in
  Balanced Digital Multipoint Systems
body: TIA
domain: networking
year: 1998
scope: >-
  Defines the electrical layer commonly called RS-485: driver and
  receiver voltage levels, common-mode range, unit loads, and termination
  for balanced differential multipoint data transmission over a twisted
  pair. It specifies electrical characteristics only — no connector, no
  data-link framing, no protocol — which is why every RS-485-based
  control protocol has to define its own connector, unit-load budget, and
  packet framing on top of it.
