notes: >-
  Approved 1 March 1998 as a revision of the original EIA-485 (1983); no
  later edition has been found in TIA's own published revision lists, so
  -A remains the current text. This is the generic industrial electrical
  layer both DMX512 and RDM (E1.20) ride on — both are explicitly
  RS-485 transports in their own showstack entries — with ANSI E1.11
  (DMX512-A) adding its own connector, termination, and unit-load rules
  on top of this document.
