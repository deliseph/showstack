notes: >-
  Edition 2.0, published 30 September 2013, stability date 2029; a
  technical revision of the 2002 first edition, which replaced the older
  "Linear" weighting with the defined Z (zero) weighting used today. Part
  2 (IEC 61672-2) covers pattern-evaluation tests and Part 3 covers
  periodic testing — separate documents from this specifications part.
