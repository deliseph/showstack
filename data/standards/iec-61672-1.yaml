id: iec-61672-1
designation: IEC 61672-1:2013
title: "Electroacoustics - Sound level meters - Part 1: Specifications"
body: IEC
domain: audio
year: 2013
scope: >-
  Specifies the performance requirements and tolerances for sound level
  meters, including the A, C, and Z frequency-weighting curves that
  produce dB(A), dB(C), and dB(Z) readings, and the Fast/Slow
  time-weightings used to integrate a reading. It is the document a
  meter's accuracy class (Class 1 or Class 2) is actually rated against.
