scope: 'The enforceable US design standard under the Americans with Disabilities Act. For
  venues: accessible routes, wheelchair spaces and companion seats in assembly areas, dispersion
  and line-of-sight requirements, accessible performance areas, and assistive listening system
  provision and receiver counts.'
