notes: Section 221 (assembly areas) and section 219 (assistive listening) are the ones that
  decide house seating layouts and how many hearing-loop or IR receivers a venue must hold.
  Free to read in full. Scenic and FOH positions that eat an accessible route or block a sightline
  from a wheelchair space are a compliance problem, not just a courtesy one.
