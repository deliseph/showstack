notes: This is the document behind "why does that LED fixture strobe on camera at 1/1000th".
  PWM dimming below a few kilohertz is visible to a rolling shutter long before it is visible
  to a person, which is why broadcast specs quote flicker limits that stage rigs never had
  to meet.
