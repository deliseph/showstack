id: cyclorama
en: Cyclorama
zh_hant: 天幕
domain: scenic
definition_en: The large plain cloth or wall across the back of the stage, lit to
  become sky, colour field or projection surface. Usually the last thing upstage,
  and the reason the upstage lighting bar is called the cyc bar.
definition_zh_hant: 舞台最後方的大面素色幕或牆，打燈後變成天空、色底或投影面。最上舞台那支燈桿因此叫天幕燈桿。
