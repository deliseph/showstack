id: stage-weight
en: Stage weight / brace weight
zh_hant: 舞台鐵（壓重）
domain: scenic
definition_en: The cast-iron slabs that anchor scenery braces, booms and free-standing
  elements. Counted in the ground plan, moved by hand, and the difference between
  a braced flat and a falling one.
definition_zh_hant: 壓住景片斜撐、燈架同企位裝置嘅鑄鐵塊。圖上要數，人手搬，係景片企得穩唔穩嘅分別。
