id: prompt-corner
en: Prompt corner
zh_hant: 提場角
domain: stage-management
definition_en: 'The stage-management position at the side of the stage from which
  the show is called: cue lights, comms, the book. Traditionally stage left in the
  UK (prompt side, PS) with the opposite side called OP (opposite prompt).'
definition_zh_hant: 舞台側面叫show嘅位置：cue燈、通話、劇本。英制傳統喺演員左側（Prompt Side, PS），對面叫 OP。
regional_variants:
- region: UK
  term: Prompt side / PS and OP
- region: US
  term: Calling position (often booth instead)
see_also:
- deputy-stage-manager
- call
safety_critical: false
confidence: reported
