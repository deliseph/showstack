id: gain-before-feedback
en: Gain before feedback (GBF)
domain: audio
definition_en: >-
  How much a microphone can be turned up before the system starts to ring,
  usually talked about in dB of headroom above operating level. Driven far
  more by mic placement and polar pattern than by EQ — moving a vocal mic
  six inches closer to the mouth usually buys more GBF than any amount of
  notching ever will.
