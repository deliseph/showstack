id: lockout-tagout
en: Lockout/tagout (LOTO)
zh_hant: 上鎖掛牌
domain: safety
definition_en: >-
  Physically locking an energy-isolating device — a breaker, a disconnect,
  a valve — in the off position and tagging it before anyone works on the
  equipment downstream, so a second person cannot re-energise it while a
  tech's hands are inside. The tag is a warning; the lock is the actual
  control. US practice under OSHA treats it as one program covering every
  energy type, verified by trying to start the equipment afterward, not
  just reading a meter.
false_friends:
- >-
  US LOTO (OSHA 1910.147) verifies by "try-out" — attempting to start the
  equipment. UK "safe isolation" is narrower, electrical-only, verified by
  proving dead with a voltage indicator.
- >-
  The two overlap but are not one procedure. A site running to one
  standard is not automatically compliant with the other, whatever a
  touring rider assumes.
regional_variants:
- region: HK
  term: 上鎖掛牌
  note: HKSAR EMSD guidance on breaker/switch isolation for electrical work uses 開關掣上鎖掛牌 for this exact procedure.
see_also:
