id: downstage
en: Downstage
zh_hant: 下舞台（舞台前方）
domain: general
definition_en: 'The part of the stage nearest the audience: downhill on a historical
  raked stage. Cross downstage and you get closer to the house.'
definition_zh_hant: 舞台上最接近觀眾的區域，斜舞台的「下坡」方向。
