id: practical
en: Practical
zh_hant: 實用道具（praccy）
domain: scenic
definition_en: 'A prop or scenic element that really works on stage: a lamp that
  lights, a hob that heats, a tap that runs. Practicals sit at the junction of departments,
  which is why who owns the table lamp is a production meeting question.'
definition_zh_hant: 台上真識著、真識用嘅道具或佈景：識著嘅檯燈、出水嘅水龍頭。跨部門邊界物，邊個部門負責係製作會議先傾得掂嘅事。
