id: ring-out
en: Ring out / ringing out
domain: audio
definition_en: >-
  Deliberately pushing each speaker zone toward feedback before doors, then
  pulling the specific frequencies that ring first on a parametric or
  graphic EQ. Normally done on monitor wedges first, then FOH, well before
  soundcheck proper — not a live-mixing move, and not the same thing as
  EQing for tone.
see_also:
