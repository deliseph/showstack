id: daisy-chain
en: Daisy chain
domain: networking
definition_en: >-
  Wiring devices in a straight line, in and out, rather than back to a
  central point. DMX and RS-485 in general are meant to run this way —
  console to fixture to fixture to fixture, terminated at the far end.
  Splitting one line out to several fixtures from a single point — a
  passive Y-split, a hub-and-spoke run — is not a daisy chain, and is
  where most unexplained DMX flicker actually comes from.
false_friends:
- >-
  A climbing "daisy chain" is a sewn webbing sling aid climbers clip into
  for positioning — real gear, not rated as an anchor, and nothing to do
  with wiring topology despite the shared name.
