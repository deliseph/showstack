id: network-tap
en: Network TAP
zh_hant: 網路分接器
domain: networking
definition_en: A passive device spliced into a link that copies everything passing through it
  to a monitoring port. Passive is the point. It has no configuration, cannot drop traffic,
  and keeps working if it loses power, so it never becomes the thing that broke the show.
definition_zh_hant: 串接在線路中的被動裝置，把通過的所有流量複製到監看埠。被動正是重點：它沒有設定、不會丟棄流量，斷電後仍能導通，因此絕不會變成把演出弄壞的那個環節。
regional_variants:
- region: UK / US
  term: TAP / network tap
- region: HK / TW
  term: 網路分接器 / 分光器
false_friends:
- A port mirror or SPAN does the same job in software and costs nothing, but a busy switch
  drops mirrored frames before real ones. For proving a timing problem, use a TAP.
