id: keying
en: Keying (chroma key / luma key)
domain: video
definition_en: >-
  Making part of an image transparent so another source shows through it.
  Chroma key removes a specific colour — green or blue screen. Luma key
  removes a brightness range instead, which is why it still works on
  footage with no coloured screen at all: titles on black, or pulling a
  bright practical light through a layer.
false_friends:
- >-
  Calling for "a key" on comms doesn't say which technique. If the
  background isn't a clean solid colour, chroma key won't pull it — you
  need luma key or a different composite instead.
safety_critical: false
confidence: reported
