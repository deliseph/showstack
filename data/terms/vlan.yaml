id: vlan
en: VLAN
zh_hant: 虛擬區域網路
domain: networking
definition_en: A logical network carved out of one physical switch fabric, so lighting,
  audio, video and corporate traffic can share copper without seeing each other. Ports are
  either access (one VLAN, untagged) or trunk (several VLANs, tagged).
definition_zh_hant: 在同一套實體交換器架構上切分出的邏輯網路，讓燈光、音訊、影像與辦公流量共用線路而互不可見。連接埠分為 access（單一 VLAN、不加標籤）與
  trunk（多 VLAN、加標籤）兩種。
regional_variants:
- region: UK / US
  term: VLAN
- region: HK / TW
  term: VLAN / 虛擬區域網路
false_friends:
- A VLAN is not a firewall. Traffic between VLANs is blocked only until someone adds a route;
  and multicast still floods within a VLAN unless IGMP snooping is on.
