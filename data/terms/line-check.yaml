id: line-check
en: Line check
zh_hant: 線路檢查
domain: audio
definition_en: 'Verifying every input reaches the console: mic by mic, DI by DI,
  before anyone plays a note. A soundcheck without a line check is how the first
  song opens with a dead vocal mic.'
definition_zh_hant: 逐路輸入證明訊號到台：每支咪、每個 DI，未 check 完無人開歌。
