id: legs
en: Legs
domain: scenic
definition_en: >-
  Narrow vertical drapes hung in pairs at the sides of the stage to mask
  the wings from the audience's sightline. Usually velour or commando
  cloth, hung with enough fullness that they do not look limp, and
  numbered from the proscenium upstage the same way battens are. Only the
  legs create the wing entrances — a border above them masks overhead,
  not the sides.
