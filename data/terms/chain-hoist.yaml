id: chain-hoist
en: Chain hoist / chain motor
zh_hant: 電動葫蘆
domain: automation
definition_en: >-
  A powered or hand-chain hoist built to raise and lower a suspended load,
  used in entertainment rigging as point hoists for trussing, scenery or
  effects. "Chain motor" usually means the electric version run from a
  pendant or network control; a plain "chain hoist" can be manual. What
  makes it a hoist under the entertainment standard is not the chain — it
  is a locking brake built to hold a suspended load. A winch is a
  different class of machine.
definition_zh_hant: >-
  以鏈條升降吊掛負載的葫蘆，可為電動或手拉。台灣多稱「電動吊車」或「電動葫蘆」，香港常直接說 motor 或「摩打」。
false_friends:
- >-
  ANSI E1.6-1's own annex draws the line: a hoist lifts with a locking
  brake for suspension; a winch pulls, and a capstan winch is explicitly
  outside the standard's scope.
- >-
  Crews use "hoist," "chain motor" and "winch" almost interchangeably. If
  it's actually a winch under that truss, it may not be rated to hold a
  static load the way a purpose-built hoist is.
