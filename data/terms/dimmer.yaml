id: dimmer
en: Dimmer
zh_hant: 調光器
domain: lighting
definition_en: The device that varies power to a lighting load. A generation ago
  every stage light lived on a dimmer channel; now most fixtures dim themselves
  and dimmers survive for tungsten, practicals and houselights, with "hot power"
  (constant circuits) doing the rest.
definition_zh_hant: 控制燈具電力的設備。以前每盞燈都行 dimmer channel；而家大部分燈自己調光，dimmer 留返俾鎢絲燈、道具燈同觀眾席燈，其餘行常火。
