id: safe-working-load
en: Safe working load (SWL) / working load limit (WLL)
zh_hant: 安全操作負荷
domain: safety
definition_en: >-
  The maximum load a piece of rigging hardware is rated to carry in normal
  service — not its breaking strength, and not a number to back-calculate
  yourself from breaking strength by guessing at a safety factor. WLL is
  the term current US and ISO entertainment-rigging standards use; SWL is
  the older term, still current in UK and Commonwealth usage, for the
  same underlying idea. Read the tag or the certificate rather than
  assume which convention a rider is using.
false_friends:
- >-
  SWL and WLL usually mean the same number today, but SWL historically
  implied a fixed safety factor — one that varied by hardware type and
  could be wrongly assumed rather than checked.
- >-
  Neither is breaking strength — a lab figure from destructive testing.
  WLL/SWL already accounts for wear, cyclic and side loading, and is the
  number you're actually allowed to use.
