id: deck
en: Deck / the deck
domain: scenic
definition_en: >-
  The stage floor. Crews say "clear the deck," "walk the deck" before a
  tech to check for trip hazards, and "deck crew" for whoever works at
  floor level during the show. A raked deck is a sloped one.
false_friends:
- >-
  In audio and video, a "deck" is a playback or recording transport — a
  tape deck, an ISO deck. "Roll the deck" and "clear the deck" are
  instructions to different people about different things.
see_also:
