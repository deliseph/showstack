id: unit-load
en: Unit load
domain: networking
definition_en: >-
  The standard reference load an RS-485 bus segment is rated against —
  one unit load is roughly a 12 kΩ receiver input. The spec caps a
  segment at 32 unit loads, but that is not the same as 32 devices: most
  modern DMX/RS-485 receiver chips present a fraction of a unit load
  (1/8 UL is common), so a real line can carry well over 32 physical
  fixtures before it needs an opto-splitter. Check the fixture manual for
  its actual unit-load figure rather than counting boxes.
