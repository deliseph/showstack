id: competent-person
en: Competent person
domain: safety
definition_en: >-
  Whoever is legally allowed to sign off that a task, a rig or a piece of
  equipment is safe. What that actually requires depends entirely on which
  country's regulation you are standing under — it is not a synonym for
  "someone who is good at their job," and it is not one qualification you
  can carry between jurisdictions.
false_friends:
- >-
  US OSHA (29 CFR 1926.32(f)): able to identify hazards AND has authority
  to fix them on the spot, tied to a specific hazard class such as fall
  protection or excavation.
- >-
  UK law (Management of H&S at Work Regs 1999, reg. 7): a broader
  general-duty role — sufficient training, experience or knowledge to
  assist the employer, not tied to one hazard class.
- >-
  A sign-off valid under one country's definition does not automatically
  satisfy the other's, even though riders use the phrase as if it meant
  one thing worldwide.
