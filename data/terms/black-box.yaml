id: black-box
en: Black box
domain: general
definition_en: >-
  A square or rectangular room with black walls and a black floor, built
  with no fixed stage or seating so it can be reconfigured for whatever
  the production needs. When someone says "we're in a black box," they
  mean the venue type — not the other thing this exact phrase means on
  the same crew.
false_friends:
- >-
  Elsewhere on the same show, "black box" means a system judged only by
  its inputs and outputs — a media server or DSP unit nobody can see
  inside. Same words, unrelated to the venue.
