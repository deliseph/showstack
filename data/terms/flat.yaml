id: flat
en: Flat
domain: scenic
definition_en: >-
  A rectangular scenic unit — a lightweight frame covered in muslin or
  luan — built, painted, and either flown in on a batten or braced
  upright at the edge of the stage with a stage weight or brace. The
  basic unit most built scenery still reduces to, long before anyone says
  "unit set" or "modular."
false_friends:
- >-
  Lighting crews use "flat" for shadowless, low-contrast light — the
  opposite problem from a piece of scenery. "It's reading flat" on comms
  is almost always about the light, not the build.
see_also:
