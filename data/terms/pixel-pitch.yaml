id: pixel-pitch
en: Pixel pitch
zh_hant: 點間距
domain: video
definition_en: >-
  The centre-to-centre distance between LED pixels on a video wall panel,
  in millimetres — P2.6, P3.9, P4.8 and so on. A smaller pitch packs more
  pixels into the same panel area and holds up at closer viewing
  distance, at a real cost in price, weight and power draw. The right
  pitch is set by minimum viewing distance, not by "smaller is always
  better."
definition_zh_hant: >-
  LED 顯示屏相鄰像素中心到中心的距離，單位為毫米。數字越小、解析度越高，最短可視距離也越近。
safety_critical: false
confidence: reported
