id: barn-door
en: Barn door
zh_hant: 遮光板
domain: lighting
definition_en: The hinged metal flaps that clip into the front of a fresnel or PAR to cut
  the edge of the beam off scenery, a portal or the front row. Four leaves, rotatable in
  the accessory slot.
definition_zh_hant: 夾在菲涅爾燈或 PAR 燈前方的鉸鏈金屬葉片，用來把光邊切離景片、台口或前排觀眾。通常四片，可在配件槽內旋轉。
regional_variants:
- region: UK / US
  term: Barn door
- region: HK / TW
  term: 遮光板 / 四葉片
false_friends:
- Barn doors soften a cut; shutters in a profile/ellipsoidal make a hard one. Asking for
  a "sharp cut" on a fresnel gets you the softest edge in the rig.
see_also:
- gel
- focus
