id: subtractive-mixing
en: Subtractive colour mixing
zh_hant: 減色混合
domain: lighting
definition_en: Mixing by removing light. One white source passes through layers that each
  remove part of the spectrum, and removal multiplies rather than adds, so you start at white
  and take away. This is what gel does, what a CMY fixture's dichroic flags do, and what a
  costume does to the light falling on it.
definition_zh_hant: 以扣除光線來混色。單一白光穿過若干層，每層扣掉一部分光譜；扣除是相乘而非相加，因此起點是白，逐層減去。色紙、CMY
  燈具的二向色濾片，以及打在服裝上的光，都是這樣運作。
regional_variants:
- region: UK / US
  term: Subtractive mixing
- region: HK / TW
  term: 減色混合 / 減法混色
false_friends:
- On a subtractive fixture, saturation costs output; on an additive one it does not. Two
  units set to the same picker value will not match, having taken different spectral routes.
