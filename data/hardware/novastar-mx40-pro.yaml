gotchas:
- NovaStar receiving cards, sending cards and firmware versions have to match. A wall assembled
  from two hire stocks with different receiving card generations may simply not map.
- Screen configuration files travel with the wall, not the processor. Losing the file means
  rebuilding the map panel by panel on site.
