gotchas:
- CRMX and W-DMX are different, incompatible systems. A fixture with a built-in CRMX receiver
  will not pair with a W-DMX transmitter, and both are commonly called just "wireless DMX"
  on a rider.
- Receivers stay linked to the last transmitter they were paired with, stored in the fixture.
  A fixture that arrives from another job will ignore your transmitter until it is unlinked.
- 2.4 GHz is shared with Wi-Fi, comms and everything else. CRMX hops and copes well, but a
  dense festival site is still a spectrum planning problem, not a plug-and-play one.
