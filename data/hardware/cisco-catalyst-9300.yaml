name: Cisco Catalyst 9300
vendor: Cisco
category: network-switch
status: current
summary: >-
  Enterprise stackable switch that turns up as venue and broadcast infrastructure rather than as
  touring kit. Powerful, well supported, and configured in a language that assumes a network engineer
  — which is why an entertainment-focused switch is often the better answer on a truck.
