  direction: bidirectional
  note: Depending on licence and configuration.
  confidence: reported
- protocol: snmp
  direction: bidirectional
  note: Monitoring.
  confidence: reported
- protocol: dante
  direction: bidirectional
  note: Transported when configured correctly.
  confidence: reported
- protocol: sacn
  direction: bidirectional
  note: Transported; IGMP snooping and a querier must be configured.
  confidence: reported
form_factor: Rackmount stackable switch
rack_units: 1
homepage:
  url: https://www.cisco.com/
  label: Cisco
gotchas:
- IGMP snooping without a querier is worse than no snooping. On a venue switch this is the single
  most common cause of a lighting network that dies when audio is added.
- Feature availability is licensed. Confirm the licence tier before designing around PTP or advanced
  QoS.
