gotchas:
- I/O capability is a function of the fitted option cards and the racks, not of the surface. Two
  identical-looking SD12s can be very different systems.
- Agree the clock master before the first line check. A console and a stage rack disagreeing about
  clock is the most common cause of intermittent digital noise.
