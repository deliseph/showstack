gotchas:
- Mains inrush and total draw on a rack of high-density amplifiers is the real constraint,
  not the audio. Size the distro on the amplifier's worst case, not its idle draw.
- Presets are tied to specific loudspeaker models. Loading the wrong preset can damage drivers,
  so preset management is a safety matter, not a convenience.
