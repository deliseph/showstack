gotchas:
- 'Pandoras Box and Widget Designer are two products that are almost always deployed together.
  Ask which one a workflow depends on: the show logic often lives in Widget Designer, not
  in the server.'
- The coolux heritage means a lot of field knowledge, forum threads and show files predate
  the Christie branding. Version numbers matter more than the badge on the box.
