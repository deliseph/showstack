gotchas:
- Automation is the department with the shortest tolerance for improvisation. A cue change
  is a re-commissioning question, not a keystroke, and the schedule has to reflect that.
- Publishing axis positions to lighting and video is now routine, which means the automation
  network is load-bearing for departments that do not own it. Agree who is allowed to touch
  it.
