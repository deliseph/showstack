gotchas:
- The X32 OSC implementation is the reason it appears in so many show-control rigs, and it
  is not formally published by the vendor. Community documentation is what everyone actually
  uses, so treat behaviour as reported, not guaranteed.
- X32 and M32 are near-identical hardware with different preamps and branding. Show files
  largely interchange, which is convenient and occasionally surprising.
- AES50 needs shielded Cat5e and a direct run. The single most common X32 fault call is an
  unshielded cable to the stage box.
