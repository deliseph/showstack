id: behringer-x32
name: Behringer X32
vendor: Behringer
category: audio-console
released: 2012
status: current
summary: 32-channel digital console that reset the price of digital mixing, with 40 input
  channels, motorised faders, AES50 stage box support and a large ecosystem of remote-control
  apps. Ubiquitous in schools, clubs, houses of worship and small touring.
