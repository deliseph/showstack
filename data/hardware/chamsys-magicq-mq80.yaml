id: chamsys-magicq-mq80
name: ChamSys MagicQ MQ80
vendor: ChamSys
category: lighting-console
status: current
summary: >-
  Compact console running the full MagicQ software, with the same show files as the rest of the
  range. The usual argument for it is that the software is free on a laptop, so a designer can program
  anywhere and land on the console with a show that already works.
