gotchas:
- 'E2 systems are configured as a whole show: inputs, backgrounds, layers and destinations.
  A "spare E2" is only a spare if the show file and the same card population go with it.'
- Layer count is a resource shared across destinations, not a per-screen number. Adding a
  screen late can silently cost you layers on the main screen.
