gotchas:
- Picturall is a playback and blending server rather than a generative compositor. If the
  brief involves real-time 3D or notch blocks, this is the wrong tool.
- Analog Way also makes presentation switchers (Aquilon, Midra). "An Analog Way" on a rider
  is ambiguous between a server and a switcher.
