gotchas:
- Titan show files are forward-compatible but not backward-compatible. A file saved on a newer
  Titan version will not open on an older one, which bites when a spare desk in the shop has
  not been updated.
- Avolites separates the "Fixture" and "Palette" model in a way that differs from Eos and
  grandMA. Cue content stored in palettes updates globally, which is powerful and is also
  how a whole show accidentally changes colour.
- The panel width changes fader and wheel count, not capability. A show programmed on a D9-330
  fits a D9-215 but with far fewer physical playbacks, so plan the playback layout for the
  smallest desk on the tour.
