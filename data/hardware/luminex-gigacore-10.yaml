gotchas:
- 'Same Groups abstraction as the bigger GigaCores, so profiles port across the range. Export
  and carry the profile: a swapped spare boots to defaults.'
- Eight ports goes fast once consoles, nodes, media servers and a laptop are on it. Plan the
  port count with the spare laptop and the visiting engineer included.
