gotchas:
- A dimmer module and a constant-power (ThruPower or relay) module are physically interchangeable
  and electrically very different. Putting an LED fixture on a dimmer module is how expensive
  things get damaged.
- CEM3 feedback only reaches the console if the rack is on the control network. Many installs
  wire DMX only, and then nobody sees the breaker trip.
- Rack load and feeder size are a building electrical matter. Adding a moving-light rig to
  a house dimmer rack is a load calculation, not a patching exercise.
