  label: Blackmagic Videohub
gotchas:
- Router labels are the whole usability story. An unlabelled Videohub in a dark rack at 2am
  is functionally a random number generator; export the label set with the show file.
- Routing changes are instant and global. A crosspoint changed to check a source will also
  change it for anyone else using that destination, including the record.
