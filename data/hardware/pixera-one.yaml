gotchas:
- PIXERA licences by output count and feature set. A machine that plays the show in the shop
  may not have the licence tier the venue rig needs, and licences are tied to hardware.
- The timeline and the node graph are two different mental models running at once. Content
  that behaves in the node graph can still be sequenced wrongly on the timeline, and vice
  versa.
