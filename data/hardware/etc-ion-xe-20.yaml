gotchas:
- Eos show files move between every console in the family, but output capacity does not. An
  Ion Xe is licensed to a lower parameter count than an Apex, so a file that plays back on
  the big desk may exceed it.
- Eos speaks sACN, Art-Net and ETCNet3 at once and will happily output all three. Two consoles
  quietly outputting the same universe on different protocols is a merge problem that looks
  like a fixture fault.
