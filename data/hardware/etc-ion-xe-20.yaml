name: ETC Ion Xe 20
vendor: ETC
category: lighting-console
released: 2017
status: current
summary: Compact Eos-family console with twenty motorised faders and a single external monitor,
  running the same Eos software as an Apex. The workhorse of regional theatre and mid-size
  touring.
