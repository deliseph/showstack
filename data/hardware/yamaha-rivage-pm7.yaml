gotchas:
- TWINLANe and Dante are two different networks on the same system and they are not interchangeable.
  TWINLANe carries the high channel-count ring between engine and RPio; Dante is how everything
  else gets in.
- RIVAGE is a system, not a console. The surface without its DSP engine does nothing, which
  changes what a "spare desk" means on a tour.
- PM7 and PM10 differ in DSP capability and I/O, and share files only within limits. Confirm
  the model, not just "a RIVAGE".
