gotchas:
- Universe count is low compared with a touring desk. Fine for a house rig, tight once a visiting
  LED wall or a pixel-mapped set arrives.
- FLX and FLX S are different products with different fader counts and capabilities; a rider
  that just says "FLX" needs clarifying.
