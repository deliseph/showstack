gotchas:
- AES50 runs on shielded Cat5e and is latency-critical. Unshielded cable or a patch through
  a switch will not work, no matter how short the run.
- The Midas, Klark Teknik and Behringer AES50 ecosystems overlap. A DL stage box may well
  work with an X32, which is useful and also a way to end up with unexpected gear on a rider.
