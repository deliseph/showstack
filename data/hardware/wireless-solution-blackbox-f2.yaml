gotchas:
- Not compatible with CRMX. Confirm which system the fixtures have built in before hiring
  transmitters.
- Dual-band operation helps enormously on a congested site, but only if the receivers also
  support 5 GHz. A mixed-generation receiver stock pins you to 2.4 GHz.
