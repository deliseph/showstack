gotchas:
- BLU link and Dante are two separate digital audio networks in the same box. The BLU link
  ring is for BSS devices; Dante is for everything else, and they are bridged inside the DSP,
  not automatically.
- 'The whole configuration lives in a single Audio Architect file. There is no useful front
  panel: without the design file, an installed system is very hard to modify on site.'
