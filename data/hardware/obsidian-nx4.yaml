gotchas:
- 'ONYX output beyond the console''s own ports is unlocked by hardware: a console, a NET dongle
  or an NX wing. A PC alone runs the software fully but outputs only a limited universe count.'
- ONYX inherited the M-Series show file lineage. Older M-PC files import, but not everything
  survives, so budget time rather than assuming a clean conversion.
