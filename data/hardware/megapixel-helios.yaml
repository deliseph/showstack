id: megapixel-helios
name: Megapixel HELIOS LED Processing Platform
vendor: Megapixel VR
category: video-processor
status: current
summary: >-
  LED processor built for camera work: high frame rates, high bit depth and the scan behaviour that
  decides whether a wall photographs cleanly. On a virtual production stage the processor is a colour
  and timing device, not a cable adaptor.
