gotchas:
- An LED wall does not display a frame all at once; it refreshes in a scan. A camera shutter out
  of step with that scan photographs banding no grade will remove.
- Processor capacity is measured in pixels and in frame rate together. A pixel count that fits at
  30p may not fit at 60p.
