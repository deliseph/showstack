gotchas:
- Delta is a playback engine, not a live compositor. Content is prepared and ingested; last-minute
  creative changes are a content pipeline job, not a knob on the server.
- Uncompressed high-frame-rate playback is storage-bandwidth bound. The disk subsystem is
  part of the spec, so a "same model" spare with different storage may not sustain the same
  show.
