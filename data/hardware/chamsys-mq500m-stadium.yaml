gotchas:
- MagicQ output universes are licensed. The free PC version outputs a limited number of universes
  without a dongle or console, which is why a show file that runs on the desk may not output
  fully from a laptop.
- The Stadium designation is about redundancy and universe count, not a different feature
  set. Show files move between MagicQ consoles freely, but the patch may exceed a smaller
  desk's licensed output.
- MagicQ has both "Execute" and "Playback" windows and a deeply modal interface. A visiting
  operator who knows Eos or grandMA will need a briefing, not just a channel list.
