gotchas:
  - >-
    PoE is optional and budgeted. The PoE model shares 160 W across the ten front
    etherCON ports at a maximum of 30 W per port, so a rack of PoE++ devices will
    exceed it.
  - >-
    Groups are Luminex's VLAN abstraction. Group 0 is reserved for inter-switch
    links and Group 1 for management, leaving 19 generic groups, and a port left in
    the wrong group looks exactly like a bad cable.
  - >-
    Link aggregation via MultiLinkX only applies to inter-switch link ports. You
    cannot bond arbitrary edge ports to a device.
  - >-
    Ten stored profiles per switch and export/import between switches. Save and
    export the profile before the truck leaves, because a swapped spare comes out
    of the box in the default configuration.

