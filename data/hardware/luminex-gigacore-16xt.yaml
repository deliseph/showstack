id: luminex-gigacore-16xt
name: Luminex GigaCore 16Xt
aka:
  - GigaCore 16XT
vendor: Luminex Network Intelligence
category: network-switch
summary: >-
  1U managed gigabit switch built for show networks, with twelve etherCON ports,
  four SFP cages and an optional 160 W PoE budget. Configured with named Groups
  rather than raw VLAN numbers.

speaks:
  - protocol: art-net
    direction: bidirectional
    note: Transported, not originated. The switch is protocol-aware for QoS and multicast handling.
    confidence: reported
  - protocol: sacn
    direction: bidirectional
    note: Transported, not originated. IGMP snooping is the reason to use a managed switch here.
    confidence: reported
  - protocol: dante
    direction: bidirectional
    note: Transported. The manual claims low-jitter handling for Dante traffic.
    confidence: reported
  - protocol: avb-milan
    direction: bidirectional
    note: The manual states full AVB and AVB Milan support.
    confidence: reported
  - protocol: aes67
    direction: bidirectional
    note: Transported, listed alongside RAVENNA.
    confidence: reported
  - protocol: ravenna
    direction: bidirectional
    note: Transported, listed alongside AES67.
    confidence: reported
  - protocol: snmp
    direction: out
    note: SNMP monitoring of switch state.
