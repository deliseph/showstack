gotchas:
- Most "timecode problems" are level, frame rate or drop-frame mismatches rather than a dead
  cable. A box that displays the incoming rate and flags drop-frame settles the argument in
  seconds.
- Daisy-chaining timecode through device thru ports degrades it. A distribution amplifier
  that regenerates rather than buffers is the difference between eight good feeds and eight
  progressively worse ones.
