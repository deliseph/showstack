id: grandma3-full-size
name: grandMA3 full-size
aka:
  - MA3 full-size
vendor: MA Lighting
category: lighting-console
summary: >-
  The largest grandMA3 control surface, rated at 20,480 parameters with six DMX
  outputs and three network ports on the back. The desk most large touring and
  arena rigs are built around.

speaks:
  - protocol: dmx512
    direction: out
    note: Six DMX512-A outputs on 5-pin XLR female.
    confidence: verified
  - protocol: dmx512
    direction: in
    note: One DMX512-A input on 5-pin XLR male.
    confidence: verified
  - protocol: sacn
    direction: bidirectional
    note: One of the two Ethernet DMX protocols grandMA3 supports for sending and receiving.
    confidence: verified
  - protocol: art-net
    direction: bidirectional
    note: Art-Net revision 1.4db. Sent as unicast until more than five receivers subscribe to a universe.
    confidence: verified
  - protocol: osc
    direction: bidirectional
    confidence: reported
  - protocol: psn
    direction: in
    confidence: reported
  - protocol: ndi
    direction: bidirectional
    confidence: reported

physical_ports:
  - 6x XLR5F DMX512-A out
  - 1x XLR5M DMX512-A in
  - 3x etherCON/RJ45 Ethernet
  - 2x DisplayPort 1.2 for external displays

form_factor: Console with integrated displays and built-in UPS
status: current

