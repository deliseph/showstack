gotchas:
  - >-
    44 kg and 1256 mm wide before you add monitors. Check the FOH riser and the
    door it has to go through, not just the truck pack.
  - >-
    Only sACN and Art-Net are available for network DMX. A venue standardised on
    Pathport or ShowNet needs a gateway in the path.
  - >-
    Art-Net is unicast by default until more than five receivers want the same
    universe. A node that appears late in the patch can silently change the traffic
    pattern on the network.
  - >-
    Six physical DMX outputs is nowhere near 20,480 parameters. Anything past a
    handful of universes leaves the desk over the network, so the switch is part of
    the control system.

