gotchas:
- The Lake processing inside is the system tuning. Swapping an amplifier without moving its
  Lake module configuration replaces the tuning as well as the amplifier.
- Load verification will flag a driver fault before it is audible, which is only useful if
  someone is actually watching the monitoring during the show.
