gotchas:
- Layer budget depends on the input format. Running 4K sources consumes the machine's processing
  far faster than HD, so a layer count quoted in HD terms is misleading for a 4K show.
- Aquilon and Picturall are both Analog Way and do different jobs. Confirm which one a rider
  means before speccing.
