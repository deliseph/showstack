gotchas:
- MA-Net2 and MA-Net3 are different and do not interoperate. A grandMA2 and a grandMA3 cannot
  share a session; the grandMA3 runs a grandMA2 compatibility mode instead, on separate hardware
  or a separate boot.
- Still everywhere in rental stock and on riders long after being superseded, so a "grandMA"
  request needs pinning down to a generation before the truck is loaded.
- 'Sessions are the whole point and the whole risk: an accidental second session master on
  the same network is one of the classic ways a rig goes dark mid-show.'
