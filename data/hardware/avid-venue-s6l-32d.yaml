physical_ports:
- AVB link between surface, engine and stage rack
- Optional MADI / Dante engine cards
- Word clock
- MIDI
- Redundant PSU
form_factor: Control surface plus E6L engine and Stage 64 I/O
homepage:
  url: https://www.avid.com/
  label: Avid
gotchas:
- 'The plug-in rack is the reason to choose it and the main thing to plan for: DSP is finite,
  and an engine that ran the show last tour may not run this one''s plug-in list.'
- Surface, engine and stage rack are linked over AVB on dedicated cabling. This is not a general
  show network and should not be shared with one.
- AAX plug-in licences travel on iLok, not with the desk. A show file that opens without its
  iLok is a show file with empty inserts.
