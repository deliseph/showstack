name: Avid VENUE S6L-32D
vendor: Avid
category: audio-console
released: 2016
status: current
summary: Modular VENUE system with a 32-fader control surface, separate E6L engine and Stage
  64 I/O, notable for running Pro Tools and AAX plug-ins natively inside the live mix path.
