gotchas:
- 'Channel count is not fixed: it depends on how the FPGA resources are allocated between
  channels, buses and processing. A session that opens is not proof it will run at the sample
  rate you want.'
- DMI slots are the entire connectivity story beyond MADI. A Dante rider on a Quantum needs
  a DMI Dante card physically fitted, and rental stock is not consistently populated.
- Session files are version-locked to console software. Carry the exact version, or a session
  from the previous city may not load.
