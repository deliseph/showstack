name: Focusrite RedNet A16R MkII
vendor: Focusrite
category: io-interface
status: current
summary: 16 in, 16 out analogue-to-Dante interface with redundant network and PSU, used to
  get analogue sources and destinations onto a Dante network in a rack.
speaks:
- protocol: dante
  direction: bidirectional
  note: 16x16 analogue to Dante, primary and secondary ports.
  confidence: reported
- protocol: aes67
  direction: bidirectional
  note: AES67 mode.
  confidence: unverified
- protocol: word-clock
  direction: bidirectional
  note: Word clock in and out.
  confidence: reported
physical_ports:
- 16x analogue in (DB25)
- 16x analogue out (DB25)
