- Word clock in/out
- Redundant PSU
form_factor: 19-inch rack interface
rack_units: 1
homepage:
  url: https://focusrite.com/
  label: Focusrite
gotchas:
- Dante device naming is the patch. Two identically named RedNet units on the same network
  is an immediate identity clash.
- Redundant Dante means two physically separate networks, not two cables into the same switch.
  Wiring both ports to one switch provides no redundancy at all.
