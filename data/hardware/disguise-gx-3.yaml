gotchas:
  - >-
    Video output count depends on which VFC cards are fitted. The chassis
    specification alone does not tell you how many outputs a specific unit has, so
    confirm the fitted cards before you commit a screen layout.
  - >-
    Running a show on disguise server hardware needs a Pro licence on the server or
    on an editing machine in the session. A free Starter instance cannot join.
  - >-
    4U and mains-hungry. Budget rack space, cooling and power for it as a
    workstation, not as a playback appliance.

