gotchas:
- Position feedback and monitored safety are what separate this from a basic hoist controller.
  A rig running variable-speed positional moves over an audience is a different safety category
  to a dead-hang motor, governed by documents like DIN 56950-5 and EN 17206.
- The e-stop circuit is hardwired and is not a software function. It must reach every position
  where a person could be hurt, which is a cabling design decision made at the plot stage.
- Axis positions can be published to lighting and media so that followspots and projection
  track moving scenery. That makes the motion system a live dependency of the visual departments.
