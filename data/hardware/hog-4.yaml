gotchas:
  - >-
    Onboard processing stops at 8,192 channels and eight physical outputs. Past
    that you are buying DP8000 processors, which means rack space, power and
    network at the other end of the run.
  - >-
    HogNet and FixtureNet are separate networks on separate etherCON ports, and
    Art-Net or sACN leaves on a third port. Patching all three into one flat switch
    is a good way to lose a show.
  - >-
    The product is now sold and supported under ETC after High End Systems was
    acquired. Documentation and downloads live on etcconnect.com, not on the old
    highend.com paths.

