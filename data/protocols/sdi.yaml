# Schema: ../../schema/protocol.schema.json

id: sdi
name: SDI (Serial Digital Interface)
aka:
  - SDI
  - HD-SDI
  - 3G-SDI
  - 6G-SDI
  - 12G-SDI
  - SMPTE 259M
  - SMPTE 292
category: video-transport
summary: >-
  SMPTE's uncompressed baseband digital video interface, carried on 75 ohm coax
  and BNC from 270 Mb/s standard definition up to 11.88 Gb/s 12G. It is still
  the backbone of most live video: point to point, no negotiation, no network,
  and it either locks or it does not.

transport:
  - other
  - fibre

openness: open-published
spec_url:
  url: https://pub.smpte.org/pub/st292-1/st292-1-2018.pdf
  label: SMPTE ST 292-1:2018 — 1.5 Gb/s Signal/Data Serial Interface (free PDF)
steward: SMPTE (Society of Motion Picture and Television Engineers)
status: current

typical_use:
  - Camera to switcher and switcher to projector or LED processor
  - Distribution amplifiers and routers in a control room or OB truck
  - Feeding media servers, recorders and multiviewers
  - Long runs on fibre via SDI to fibre converters (SMPTE ST 297)

media:
  video:
    max_resolution: 3840x2160
    max_frame_rate: 60
    colour_sampling: ["4:2:2", "4:4:4"]
    bit_depths: [10, 12]
    compression: None — uncompressed
    note: >-
      3840x2160 needs 12G-SDI on a single link; above that you are on two
      or four. The rate tiers are SD 270 Mbit/s, HD 1.485, 3G 2.97, 6G 5.94 and 12G
      11.88. Cable reach falls as the rate rises, because coax loss goes with
      the square root of frequency and the frequency that matters is half the
      bit rate.
  audio:
    sample_rates_khz: [48]
    bit_depths: [24]
    max_channels: 16
    encoding: Embedded AES3 in the ancillary data space
    note: Sixteen channels in four groups, riding in the horizontal blanking.

gotchas:
  - >-
    The bit rate is fixed by the standard, not by the picture. ST 259 is
    143/270/360 Mb/s, ST 292-1 is 1.485 Gb/s (or 1.485/1.001), ST 2082-1 is
    11.88 Gb/s. A "12G" run is really an 11.88 Gb/s run.
  - >-
    The connector is 75 ohm BNC per IEC 61169-8. 50 ohm BNCs are mechanically
    identical, will fit, will pass SD happily, and will then fail at 3G and 12G
    in a way that looks like a bad cable everywhere else in the chain.
  - >-
    Cable loss is specified at half the clock frequency, around 20 dB for
    ST 292-1. The same drum of cable that carries HD across a stadium will not
    carry 12G, so re-derate every existing run when you upgrade rate.
  - >-
    There is no negotiation, no handshake and no error correction. A marginal
    link produces sparkles or black frames, and the receiver reports lock rather
    than quality, so "it says it is locked" proves very little.
  - >-
    Audio, timecode and captions ride as ancillary data in the blanking
    intervals. Some converters, re-clockers and scalers pass video cleanly and
    drop ANC, so timecode and captions vanish with no error anywhere.
  - >-
    Return loss is specified at 15 dB and rise time at 270 ps for HD, 45 ps for
    12G. Cheap patch panels and barrel connectors are the usual reason a 12G
    path that works on the bench fails in the rack.

confidence: verified
