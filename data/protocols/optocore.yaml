id: optocore
name: Optocore
category: audio-transport
openness: proprietary-closed
first_published: 1996
status: current
summary: 'Fibre-optic audio, video and data transport built as a redundant ring, used where
  very high channel counts have to travel long distances with deterministic latency: stadiums,
  festivals and broadcast compounds.'
transport:
- fibre
typical_use:
- Long fibre runs between FOH, stage and broadcast
- High channel-count festival distribution
- Redundant ring backbone for a large audio system
media:
  audio:
    sample_rates_khz: [48, 96, 192]
    max_channels: 1024
    note: >-
      The 1024 figure counts inputs. Outputs are effectively unlimited because the
      ring carries every channel past every node, so any device can tap any channel
      without costing anyone else bandwidth — the architectural difference from a
      switched network, where each subscriber's copy is real traffic. Channel count
      and sample rate trade against each other on a given ring speed.

gotchas:
- The ring is the redundancy. Breaking the ring to add a device mid-show removes the protection
  that justified the system.
- Optocore, MADI and Dante frequently coexist in the same rack through converter cards. Where
  the clock originates in that mix is the thing to decide deliberately.
confidence: reported
