# showstack entry — protocol
# Schema: ../../schema/protocol.schema.json

id: midi
name: MIDI 1.0
aka:
  - Musical Instrument Digital Interface
  - MIDI

category: audio-control
summary: >-
  A serial message protocol carrying notes, performance gestures, controller
  values, program changes and timing between instruments, computers and show
  equipment. It controls sound and cues but does not transport audio.

transport:
  - midi-din

openness: published-paid
spec_url:
  url: https://midi.org/midi-1-0-core-specifications
  label: MIDI Association — MIDI 1.0 Core Specifications
steward: MIDI Association (MMA/AMEI)
first_published: 1983
status: current

typical_use:
  - Keyboards and electronic instruments sending notes and performance controls to sound modules or software
  - Control surfaces operating mixer faders, mutes, transport and plug-in parameters
  - Program changes selecting patches, snapshots or show states
  - MIDI clock and transport synchronising sequencers, drum machines and playback systems

gotchas:
  - >-
    MIDI channel numbers occupy four bits in the status byte. Software commonly
    labels them 1 through 16 while protocol documentation shows the encoded
    values as 0 through 15, creating an easy off-by-one configuration error.
  - >-
    Note, velocity and ordinary controller data are seven-bit values from 0 to
    127. A fader or encoder that needs more resolution requires a defined pair
    of messages, RPN/NRPN, or manufacturer-specific SysEx support at both ends.
  - >-
    A successful send only means bytes left the interface. Basic channel voice
    messages contain no acknowledgement or device discovery, so a wrong cable,
    receive channel or mapping can fail silently.
  - >-
    The traditional 5-pin connection is directional. MIDI OUT feeds MIDI IN;
    an IN socket cannot return state, and a separate reverse connection is
    required for bidirectional control.
  - >-
    MIDI carries performance and control events rather than sampled audio. A
    device advertised as "MIDI over USB" may expose control while its audio
    still requires a separate USB Audio interface and driver.

implementations:
  - name: RtMidi
    url: https://github.com/thestk/rtmidi
    language: C++
    license: MIT
    role: both

