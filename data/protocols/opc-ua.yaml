    url: https://github.com/open62541/open62541
    language: C
    license: MPL-2.0
    role: both
  - name: asyncua (formerly python-opcua / FreeOpcUa)
    url: https://github.com/FreeOpcUa/opcua-asyncio
    language: Python
    license: LGPL-3.0-or-later
    role: both

confidence: verified
