id: bluetooth-midi
name: Bluetooth Low Energy MIDI
aka:
  - BLE-MIDI
  - Bluetooth MIDI
category: audio-control
summary: >-
  Standard encoding for carrying MIDI messages over Bluetooth Low Energy between
  controllers, instruments, computers and mobile devices without a USB or DIN cable.

transport:
  - wireless-rf

openness: open-free-registration
spec_url:
  url: https://midi.org/midi-over-bluetooth-low-energy-ble-midi
  label: MIDI over Bluetooth Low Energy specification
steward: The MIDI Association
status: current

typical_use:
  - Wireless keyboards, pad controllers and foot controllers
  - Tablet or phone music applications controlling instruments
  - Connecting battery-powered MIDI devices to a computer
  - Presenting a mobile device as a MIDI peripheral

gotchas:
  - >-
    The BLE connection and the MIDI endpoint are separate layers. A device can appear
    connected in Bluetooth tools before the operating system exposes it to MIDI software.
  - >-
    One endpoint acts as the Bluetooth central and the other as the peripheral. Two
    peripherals advertising at each other will never establish a session.
  - >-
    Reconnection behavior varies by operating system and device pairing support. Apple
    only documents automatic paired-device reconnection for macOS 13 and iOS 16 or later.
  - >-
    On older Apple implementations an idle connection may close after several minutes to
    save power, so test wake and reconnect behavior before relying on a controller live.

confidence: verified
