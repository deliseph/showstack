id: canopen
name: CANopen
aka:
  - CANopen CC
  - CiA 301

category: machinery-motion
summary: >-
  CiA's standardized application layer and communication profile riding on a
  CAN bus, giving devices a shared object dictionary and PDO/SDO messaging so
  drives, sensors and I/O from different vendors share one bus. It
  increasingly turns up in stage automation and rigging motion control, where
  the CiA 402 drive profile standardizes controller-to-servo-drive messaging.

transport:
  - other

openness: open-free-registration
spec_url:
  url: https://www.can-cia.org/cia-groups/technical-documents
  label: CiA technical documents — CANopen specifications (free download after registration/login)
steward: CAN in Automation (CiA)
first_published: 1994
status: current

typical_use:
  - Servo drive, VFD and motor-controller networking within winches, hoists and automated scenery machines (CiA 402 profile)
  - Sensor and I/O integration on machine-control buses inside automation racks and control cabinets
  - General industrial embedded device networking wherever many low-cost nodes need to share one bus

gotchas:
  - >-
    CANopen CC bit rate is fixed network-wide and trades off against cable
    length; CiA specifies 10 kbit/s to 1000 kbit/s. Reusing a bit rate chosen
    for a short rack-to-rack link on a long touring cable run is a classic
    cause of bus errors that only appear once the cable is stretched out on site.
  - >-
    The 11-bit CAN identifier splits into a 4-bit function code and 7-bit node
    ID, capping a single CANopen network at 127 nodes (0 reserved for
    broadcast); large automation systems need multiple buses/gateways well
    before that limit in practice.
  - >-
    CiA itself warns that "some vendors implement only a subset of the
    mandatory functions and parameters, but still claim CiA 402 conformity,"
    so two devices that both claim CiA 402 support are not guaranteed to
    interoperate on motion commands without testing.
  - >-
    The full CiA 301/402 specification text requires a free CiA account and
    login to download (status "Public Available Specification"); it is not a
    plain public URL, which trips up integrators expecting a direct PDF link.

confidence: verified
