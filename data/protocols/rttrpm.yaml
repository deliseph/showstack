id: rttrpm
name: RTTrPM
aka:
  - Real Time Tracking Protocol Motion
  - RTTrP Motion
  - BlackTrax protocol
category: tracking-position
summary: >-
  The packet format BlackTrax uses to stream tracked position and orientation to
  third party systems. It carries centroid and individual point positions,
  quaternion or Euler orientation, velocity, acceleration and zone collisions
  for lighting, video and audio consumers.

transport:
  - udp

openness: open-published
spec_url:
  url: https://rttrp.github.io/RTTrP-Wiki/RTTrPM.html
  label: RTTrPM packet structure and module definitions
steward: CAST Group (BlackTrax)
status: current

typical_use:
  - BlackTrax feeding media servers for projection onto moving objects
  - Driving moving lights and followspot systems from beacon positions
  - Positioning sources in object-based audio renderers
  - Triggering show events from zone collision detection

gotchas:
  - >-
    The RTTrP header carries both a big-endian signature (0x4154) and a
    little-endian one (0x5441). Read the signature first and byte-swap the rest
    of the packet accordingly, or every position you decode looks like noise.
  - >-
    A packet is a header plus a variable list of modules, each with its own type
    and size. Do not assume fixed offsets. Walk the module list by declared
    size or you will break on the next firmware release.
  - >-
    Centroid position and tracked point position are separate module types. A
    beacon taped to a performer's shoulder is not the centroid of the trackable,
    and consuming the wrong one puts the light in the wrong place.
  - >-
    RTTrPM (motion) and RTTrPL (lighting) share the same header. Motion is a
    fixed-rate stream, lighting is event-driven, so a receiver that assumes a
    steady packet rate will time out on the lighting side.
  - >-
    The wiki documents no default port and no default address. Whatever the
    BlackTrax output configuration says is the truth, so get it from the
    tracking operator rather than guessing.

