id: madi
name: MADI (AES10)
aka:
- Multichannel Audio Digital Interface
- AES10
category: audio-transport
summary: A long-established AES standard for point-to-point transport of up to 64 channels of digital
  audio over a single coax (BNC) or fiber link, still widely used for touring FOH/monitor console splits,
  digital snakes, and broadcast/live-sound interconnects.
transport:
- other
- fibre
openness: open-free-registration
steward: Audio Engineering Society (AES)
status: current
media:
  audio:
    sample_rates_khz: [48, 96]
    bit_depths: [24]
    max_channels: 64
    encoding: Linear PCM
    note: >-
      64 channels at 48 kHz on one coax or fibre, halving to 32 at 96 kHz.
      The channel count is fixed by the frame structure, so a MADI link is
      always the same bandwidth whether the channels carry audio or silence.

gotchas:
- Original AES10-1991 caps out at 56 channels at 48kHz; 64-channel and higher-sample-rate operation needs
  the AES10-2003/2008 revisions and matching gear.
- Point-to-point only, with no built-in routing/addressing - multi-device MADI systems need external routers
  or matrix switchers.
- Coax (75-ohm BNC) and optical (SC) variants are not interchangeable without a converter, and each has
  different maximum cable runs.
confidence: verified
