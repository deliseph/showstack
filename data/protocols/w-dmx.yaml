id: w-dmx
name: W-DMX
aka:
  - Wireless DMX
category: lighting-control
summary: >-
  Proprietary radio system for carrying DMX512 and supported RDM traffic between
  lighting controllers, transmitters, receivers and fixtures without a DMX cable.

transport:
  - wireless-rf

universe_model: One or more 512-channel DMX universes, with capacity determined by the transmitter and radio mode.
openness: proprietary-closed
steward: Wireless Solution / LumenRadio
status: current

typical_use:
  - Sending DMX to fixtures where running a data cable is impractical
  - Temporary stage and event lighting links
  - Built-in wireless control of moving lights and battery fixtures
  - Bidirectional RDM discovery and configuration on supported products

gotchas:
  - >-
    W-DMX generations and radio modes are compatibility settings, not cosmetic labels.
    Changing the transmitter control mode requires receivers to be linked again.
  - >-
    Frequency-band support depends on the hardware. G3 uses 2.4 GHz; later G4S and
    G5 equipment may also offer 5.2 or 5.8 GHz, but not every receiver supports them.
  - >-
    A transmitter and receiver must be linked before DMX passes. A receiver remembered
    from another rig can appear healthy while ignoring the transmitter on this show.
  - >-
    RDM support depends on the product and selected mode. Verify the whole chain before
    relying on remote fixture discovery or configuration during a live setup.

confidence: verified
tags:
  - dmx
  - rdm
  - wireless
  - lighting
  - rf

