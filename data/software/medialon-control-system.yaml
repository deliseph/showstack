gotchas:
- Installations outlive the people who programmed them. Documentation and commented code are
  the deliverable as much as the running show.
- Device drivers are the whole integration story. A device with no driver is a scripting project,
  not a checkbox.
- 'Unattended operation means failure handling has to be designed, not discovered: what happens
  when a projector does not respond at 09:00 is a specification question.'
