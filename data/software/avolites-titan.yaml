typical_use:
- Busking and timecoded playback for touring bands and festivals
- Pre-programming a show on a laptop with Titan Simulator or Titan Mobile
- Small rigs run from Titan Go on a T1/T2 interface
- Previsualisation against the integrated Capture visualiser
gotchas:
- Everything is keyed to an AvoKey. Titan Mobile only runs while its panel is connected, Titan Go
  licenses the AvoKey built into a T1/T2/T3, and Titan Simulator needs an Editor AvoKey.
- Titan Simulator does output full Art-Net/sACN on all universes, but deliberately inserts periodic
  random DMX values as a spoiler. It is not a show controller.
- 64 lines/universes is the system ceiling. Line numbers can be anything from 1 to 9999 but there
  cannot be more than 64 of them. T3 needs an optional licence pack to reach 64, and its onboard processing
  stays at 16 lines.
- RDM discovery only works through an RDM-enabled Art-Net node. The console XLRs will not do it, and
  a non-RDM buffer or splitter anywhere in the chain blocks the reply.
- Windows only. Windows 11 is supported from v16.0 onwards, and Avolites explicitly does not support
  Bootcamp, VMware or Parallels.
- Titan Mobile and Titan Go will not launch at all without their hardware connected, so a dead panel
  also means no offline editing on that machine.
confidence: verified
