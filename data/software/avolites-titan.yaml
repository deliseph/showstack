id: avolites-titan
name: Avolites Titan
aka:
- Titan
- Titan Mobile
- Titan Go
- Titan Simulator
- Titan PC Suite
vendor: Avolites
category: lighting-control
summary: 'Avolites'' lighting control software: the operating software on Sapphire, Diamond, Tiger
  Touch and Arena consoles, and the same code on Windows as Titan Mobile, Titan Go and Titan Simulator.
  Standard kit for rock and roll touring and festivals.'
license: proprietary
price_model: dongle-locked
platforms:
- windows
speaks:
- protocol: art-net
  direction: out
  note: One of the two network DMX protocols Titan uses to reach nodes and dimmers.
  confidence: verified
- protocol: sacn
  direction: bidirectional
  note: sACN out to nodes, and Streaming ACN In is also available as an external trigger source on
    supported consoles.
  confidence: verified
- protocol: dmx512
  direction: out
  note: Physical DMX512 on console XLR outputs; on a PC, via a T1/T2/T3 interface. DMX In is a separate
    trigger source on supported consoles.
  confidence: verified
- protocol: citp
  direction: bidirectional
  note: Patch syncs both ways with stand-alone Capture (fixture, position, orientation, legend, user
    number) and fixture selection follows across. Levels still need Art-Net or sACN enabled on those
    universes.
  confidence: verified
- protocol: rdm
  direction: bidirectional
  note: Patching by RDM requires an RDM-enabled Art-Net node. The console's own XLR connectors do
    not support RDM.
  confidence: verified
- protocol: ltc
  direction: in
  note: SMPTE/LTC listed on T2, T3, D3, D3 Core, D7, D9, Arena, Tiger Touch 2 and Sapphire. A T2 plugged
    into another console adds an audio/LTC input.
  confidence: verified
- protocol: midi
  direction: in
  note: MIDI is one of the external trigger types and is not available on every console; USB MIDI
    devices are supported for triggering and control.
  confidence: verified
- protocol: mtc
  direction: in
  note: A cue list can read timecode from the system clock, an internal timecode source, MIDI, SMPTE
    or the Winamp player. Up to 4 separate timecode sources per console.
  confidence: reported
