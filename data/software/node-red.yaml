typical_use:
- Translating between two systems that will never support each other
- Installed automation and scheduling
- Prototyping an integration before writing it properly
gotchas:
- A flow is easy to build and hard to review — the same problem as any patching environment. Export
  and version it.
- Community nodes vary in maintenance. Freeze the set a production depends on.
