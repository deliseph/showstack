status: current
typical_use:
- Building the audio DSP, routing, paging and BGM for a venue or attraction
- Lua, Control Script and Block Controller logic tying AV and building systems together
- Timecode-triggered show events driven from the SMPTE LTC Reader
- Custom touchscreen UCIs for operators and front-of-house staff
- Offline design and emulation before the hardware exists on site
- Exposing Named Controls so a third-party controller drives the system over QRC or ECP
gotchas:
- Third-party control needs Named Controls. A control that has not been selected and named in Designer
  is simply not visible to QRC (TCP 1710) or ECP (TCP 1702), which is where integrators lose hours
  to the API cannot see my fader.
- 'QRC and ECP connections drop if the client goes quiet: QSC require traffic at least every 60 seconds.
  A keepalive or polling loop is not optional in a long-running integration.'
- Designs are not backward compatible. Anything using hardware, features or properties introduced
  in a newer QDS release may not open in an older one, so the Designer version on the commissioning
  laptop is part of the system documentation.
- Control licensing moved. Scripting Engine and UCI Deployment were paid feature licences; QSC state
  licences are no longer required for Q-SYS Control capabilities on v10 and above. Quotes written
  against older documents will be wrong in both directions.
- Dante is a licensed, channel-limited software feature on a Core, not a given. Match the tier to
  the actual channel count and Core model before promising anyone a Dante path.
- 'The Timeline component that plays audio files against an external LTC input is still marked BETA
  in v10.4: functional, but not feature complete and subject to change. Do not hang a twenty-year
  attraction on it without a fallback.'
- OSC does not appear in QSC's documented network services. Field OSC integrations are third-party
  plugins or sockets opened from Lua, so treat OSC as something you build rather than something you
  enable.
- Designer is Windows only. QSC's requirements list Windows 11 x64 and note testing inside a Windows
  11 VM under Parallels on Apple silicon, but a Mac-only crew has no native option.
confidence: verified
