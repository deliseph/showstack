id: qsys-designer
name: Q-SYS Designer
aka:
- Q-SYS Designer Software
- QDS
vendor: QSC, LLC
category: audio-mixing
summary: 'Windows design and deployment software for the Q-SYS platform: you draw the DSP, control
  logic and touchscreen UIs as a schematic, then push the whole design to a Core. Widely specified
  as the audio and control brain of venues, theme parks and installed AV.'
license: proprietary
price_model: free
platforms:
- windows
speaks:
- protocol: aes67
  direction: bidirectional
  note: Cores stream AES67 as multicast alongside the native Q-LAN transport. QSC's capacity tables
    count Q-LAN and AES67 network channels together and list no separate AES67 feature licence.
  confidence: verified
- protocol: dante
  direction: bidirectional
  requires_licence: true
  note: Dante on a Core is the Software Dante feature licence, sold in channel-count tiers from 8x8
    up to 512x512 depending on Core model and QDS version.
  confidence: verified
- protocol: ltc
  direction: bidirectional
  note: 'Stock schematic components: the SMPTE LTC Reader decodes LTC from an audio input per SMPTE
    12M and exposes timecode fields as control pins for Lua; the SMPTE LTC Generator is the encoder
    counterpart.'
  confidence: verified
- protocol: ptp-1588
  direction: bidirectional
  note: PTPv2 (IEEE 1588-2008) on multicast 224.0.1.129, UDP 319-320. It is the clock for Q-LAN and
    AES67 and is documented as time-sensitive traffic the network must prioritise.
  confidence: verified
