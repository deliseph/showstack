summary: >-
  Small, fast-opening, genuinely free real-time engine under a permissive licence with no royalty
  and no company able to change the terms later. Smaller ecosystem and fewer industry integrations
  than Unreal or Unity — the right pick for learning, for tools a venue owns, and for anything that
  must still run in ten years.
