gotchas:
- Smode is both the design tool and the playback engine, which is efficient and means a design
  change on site is a live edit to the thing that is playing the show.
- Real-time generative content is GPU-bound in ways that pre-rendered playback is not. The
  machine that ran the design at 60 fps in the studio may not with the full show loaded.
