status: current
typical_use:
  - Programming and playing back mapped video on LED and projection
  - Previsualisation of a stage design before load-in
  - Driving disguise hardware in a multi-server session with understudy backup
  - Extended reality and virtual production stages

gotchas:
  - >-
    Projects saved in the free Starter tier are permanently locked to Starter.
    Pro can open anything except a Starter project, so evaluating on Starter and
    then upgrading means rebuilding the file.
  - >-
    Starter cannot join a session with disguise servers or Pro instances, and its
    output carries an intermittent blue flash. It is a learning tier, not a
    small-show tier.
  - >-
    Licensing is either a cloud licence tied to a disguise Cloud account or a
    CodeMeter USB dongle. Only dongles with serial numbers starting "3-" are
    supported, and cloud licences need internet to activate and check in or out.

confidence: reported
