id: touchdesigner
name: TouchDesigner
aka:
  - TD
vendor: Derivative
category: content-creation
summary: >-
  Node-based visual development environment for real-time generative content,
  interactive installations and custom control surfaces. Frequently deployed as
  the content engine behind a show rather than as a cue playback tool.

license: proprietary
price_model: freemium
