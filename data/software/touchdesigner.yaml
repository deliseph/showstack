homepage:
  url: https://derivative.ca/
  label: derivative.ca
docs:
  url: https://docs.derivative.ca/
  label: TouchDesigner documentation

status: current
typical_use:
  - Generative and reactive content driven by live data or sensors
  - Custom operator interfaces and bespoke control glue
  - Projection content and LED processing pipelines
  - Prototyping interactive installations

gotchas:
  - >-
    The free Non-Commercial licence caps image resolution at 1280x1280 and locks
    out Shared Memory, C++ and SDI operators. A project prototyped on it will not
    scale to a real output without paying.
  - >-
    Projection calibration, optical tracking, motion capture input and
    multi-process sync are Pro-tier only, so a Commercial licence is not enough for
    a mapped or tracked show.
  - >-
    Non-Commercial keys are tied to the machine and cannot be moved. Only
    Commercial and higher licences transfer between computers, which matters when
    a show laptop dies.

