typical_use:
- Interactive installations and generative content
- Custom show tooling where an audio signal and a control message need to meet
- Max for Live devices inside Ableton Live
gotchas:
- Patches do not diff. Version them by hand and write down what each version changed, because the
  usual "what changed?" safety net does not exist.
- 'The tilde matters: objects ending in ~ run at audio rate, the rest run on messages. Mixing the
  two mental models is the classic beginner fault.'
- A show machine needs its licence sorted before the tour, not after — check what an unattended
  install is allowed to do.
