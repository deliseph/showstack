- protocol: midi
  direction: bidirectional
  note: Core to Max since the beginning.
  confidence: reported
- protocol: osc
  direction: bidirectional
  note: Via widely used objects rather than as a built-in.
  confidence: reported
- protocol: ableton-link
  direction: bidirectional
  note: Through Max for Live and Link-aware objects.
