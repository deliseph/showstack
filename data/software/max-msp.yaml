summary: >-
  Dataflow programming environment where a patch is built from objects joined by cables. Max is
  the message layer, MSP the sample-rate audio layer, Jitter the video and matrix layer — and being
  able to move between an event and a continuous signal in one patch is the whole reason it stayed
  the standard in music technology and interactive installation.
