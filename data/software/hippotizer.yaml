  label: Green Hippo technical support and Hippotizer manuals
status: current
typical_use:
- Large-format video playback, blending and mapping for touring concerts and corporate shows
- Media-server layers patched to and cued from a lighting console over Art-Net, sACN or MA-Net
- Pixel-mapping LED and fixture arrays from video content over Art-Net, sACN or KiNET
- Playing Notch blocks for real-time generative and IMAG effects
- Timecode-chased playback distributed across multiple servers via Sync Manager
gotchas:
- Media encoded in 4.9 uses FlexRes V2, which the release notes state is not compatible with earlier
  versions. Encode a show on a 4.9 machine and any server in the rig still on 4.8 cannot read it.
- CITP is listed in the 4.9.0 known issues as not yet functional, and even when working the manual
  warns it loads the network enough to hurt playback and recommends it for programming only, not live.
- Notch playback is licensed separately from Hippotizer. V4+ systems can play the bundled stock Notch
  effects; any third-party Notch block needs a Notch Playback dongle.
- 'Licensing splits by tier: V4, compatibility mode and Play are software-licensed, while V4+ and
  Prep are dongle-licensed. Software licences are non-transferable and drastic hardware changes stop
  the software running.'
- 'Hippotizer Play is genuinely free but crippled on purpose: two mixes of 16 layers, one watermarked
  output, no MPEG encode or playback, and PixelMapper output flashes green periodically. Fine for
  pre-programming, not for a show.'
- 'Ownership has changed hands: Green Hippo was acquired by Spitfire Creative Technologies on 1 October
  2018, and Green Hippo now describes itself as an ACT Entertainment brand.'
confidence: verified
