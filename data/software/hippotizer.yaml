id: hippotizer
name: Hippotizer
aka:
- Hippotizer V4
- Green Hippo Hippotizer
vendor: Green Hippo (an ACT Entertainment brand)
category: media-server
summary: Windows media server software built from swappable components (DMX, Timeline, PixelMapper,
  Notch, CITP) around Green Hippo's FlexRes playback engine. Standard kit for large-format video,
  blending and LED pixel-mapping on tours and corporate shows.
license: proprietary
price_model: dongle-locked
platforms:
- windows
speaks:
- protocol: art-net
  direction: bidirectional
  note: 'In: the DMX component takes Art-Net from a lighting desk to control layers, mixes and viewports,
    with auto-patch tooling. Out: PixelMapper sends Art-Net to LED fixtures.'
  confidence: verified
- protocol: sacn
  direction: bidirectional
  note: Accepted by the DMX component for desk control and available as a PixelMapper output protocol.
  confidence: verified
- protocol: ma-net
  direction: in
  note: The DMX component accepts MA-Net alongside Art-Net and sACN, and there is a dedicated MA-Net3
    component; 4.9.0 release notes add MA-Net3 networking support.
  confidence: verified
- protocol: kinet
  direction: out
  note: KiNET is one of the PixelMapper output protocols, alongside Art-Net and sACN.
  confidence: verified
- protocol: citp
  direction: out
  note: CITP component pushes media thumbnails, media names and low-resolution streaming previews
    to lighting consoles and visualisers; requires the DMX component to be running. Documented as
    Hippotizer-to-console only.
  confidence: verified
- protocol: psn
  direction: in
  note: PosiStageNet controller receives position, velocity and acceleration for multiple tracked
    objects, with axis interpolation smoothing. Docs say new projects should use the Automation Reader.
  confidence: verified
- protocol: rttrpm
  direction: in
  note: BlackTrax is listed among MultiController automation readers; the manual names the product
    rather than the RTTrPM protocol version, so the exact wire format is not confirmed in vendor docs.
  confidence: reported
- protocol: ndi
  direction: bidirectional
  note: NDI can be received on a layer, and each Mix can send an NDI feed at a configurable resolution
    and framerate, optionally with alpha. Docs warn NDI sending costs real GPU/CPU load above HD.
  confidence: verified
- protocol: midi
  direction: in
  note: MultiController maps MIDI controllers (and Stream Deck) to Hippotizer pins. Feedback capability
    is referenced but not documented in detail, so outbound MIDI is unconfirmed.
  confidence: verified
- protocol: osc
  direction: in
  note: MultiController maps OSC (and raw TCP) to pins. As with MIDI, outbound OSC feedback is referenced
    but not documented in detail.
  confidence: verified
- protocol: ltc
  direction: in
  note: Sync Manager receives LTC from an audio input (left channel), a factory-fitted Alpermann+Velte
    card, or USB interfaces (Rosendahl Mif4, CB Electronics TC-5, Adrienne Electronics USB-LTC).
  confidence: verified
- protocol: mtc
  direction: in
  note: Sync Manager receives MTC via the Rosendahl Mif4 or CB Electronics TC-5 USB interfaces.
  confidence: verified
