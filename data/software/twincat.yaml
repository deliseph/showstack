  label: Beckhoff TwinCAT
typical_use:
- Winches, lifts, revolves, turntables and kinetic scenery
- Deterministic control where a general-purpose OS cannot give a cycle guarantee
- Bridging automation state to a show-control system over OPC UA
gotchas:
- Functional safety is a separate rated channel — TwinSAFE — and it is not where your control code
  goes. It has to stay valid when the control program is wrong.
- The show network may supply timing to an automation system. It must never supply permission.
- Deterministic behaviour comes from the real-time kernel and reserved cores. A badly configured
  machine loses the guarantee without any obvious symptom until it matters.
