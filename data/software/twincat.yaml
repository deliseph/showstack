summary: >-
  Beckhoff's automation platform, and the reason an ordinary industrial PC can be trusted with a
  motion loop: a hard real-time kernel runs alongside Windows on reserved CPU cores, so the control
  task keeps its cycle no matter what Windows is doing. Developed inside Visual Studio, programmed
  in the IEC 61131-3 languages plus C++ and Simulink modules.
