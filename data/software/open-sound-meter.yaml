gotchas:
- Interface and driver quality set the noise floor and the latency stability. A cheap USB
  interface limits what any measurement software can tell you.
- 'The same measurement discipline applies as with any FFT tool: reference feed, microphone
  position and coherence still decide whether the trace means anything.'
