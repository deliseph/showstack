summary: Free, open-source dual-channel FFT measurement application covering transfer function,
  impulse response and RTA. The credible zero-cost route into system measurement.
typical_use:
- Learning system alignment without a Smaart licence
- Quick checks when the measurement rig is not on the truck
- Teaching measurement in a training context
