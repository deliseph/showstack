typical_use:
- LED screen content driven entirely from the lighting desk
- Small-format projection with console control
- Club and corporate video walls
homepage:
  url: https://www.arkaos.com/
  label: ArKaos
gotchas:
- The DMX personality is the interface. Changing the personality mid-programming shifts every
  parameter address and invalidates the console patch.
- CITP thumbnails need the console and server on the same network segment with multicast working,
  which is the usual reason a lighting operator sees black tiles.
