gotchas:
- Built-in LTC generate and chase is unusually good for a free DAW, which makes it viable
  for timecode playback rigs where Pro Tools licensing is not.
- Plug-in format support differs by platform. A session built on Linux with LV2 plug-ins will
  not open the same way on a Windows show machine.
