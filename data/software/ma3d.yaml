gotchas:
- Version-locked to the console software generation. MA 3D for grandMA2 and the grandMA3 visualiser
  are not the same product and do not share files.
- The visualiser knows the rig you built in it. Time spent making the model match the real
  plot is what determines whether the pre-programming is usable on site.
