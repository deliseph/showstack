gotchas:
- Visualiser beam appearance is a rendering choice, not a photometric measurement. Use the
  beam and photometrics maths for coverage decisions, not the picture.
- A visualiser only knows the rig you modelled. Fixture positions that differ from the plot
  make the pre-programmed show wrong in a way that looks right on screen.
