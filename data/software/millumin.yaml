id: millumin
name: Millumin
aka:
- Millumin V5
vendor: Anomes (Philippe Chaurand)
category: media-server
summary: 'macOS media server for live video: layers, timeline and column-based cueing with soft-edge
  blending and projection mapping. Widely used for projection in theatre and dance, where one Mac
  drives the whole video rig.'
license: proprietary
price_model: one-off-purchase
platforms:
- macos
speaks:
- protocol: osc
  direction: bidirectional
  note: Configurable OSC listeners and senders; an OSC API covers almost every feature. Docs also
    state Millumin supports OSCQuery, without specifying its server/client role.
  confidence: verified
- protocol: midi
  direction: bidirectional
  note: MIDI sources and destinations are enabled individually in the Devices tab; inputs can send
    feedback back to the controller (e.g. motorised faders).
  confidence: verified
- protocol: midi-show-control
  direction: in
  note: MSC GO with no Q-number advances to the next column or plays the timeline; GO with a Q-number
    launches the Nth column; GO with Q-number plus Q-list selects the board; STOP stops or pauses.
  confidence: verified
- protocol: art-net
  direction: out
  note: Art-Net output for Light Plot and LED Mapping; docs cite Artnet V1/V2 with V3/V4 said to be
    retro-compatible. Art-Net input is not documented.
  confidence: verified
- protocol: sacn
  direction: out
  note: sACN output alongside Art-Net; the manual warns sACN universe numbering starts at 1 whereas
    Art-Net starts at 0.
  confidence: verified
- protocol: dmx512
  direction: out
  note: Direct USB-DMX output; docs list Enttec DMX USB Pro and Pro Mk2, DMXking ultraDMX Micro and
    ShowJockey interfaces.
  confidence: verified
- protocol: ndi
  direction: bidirectional
  note: NDI streams can be used as a layer source, and outputs can be sent as NDI with or without
    alpha, plus audio.
  confidence: verified
- protocol: sdi
  direction: bidirectional
  note: Via Blackmagic (Intensity, UltraStudio, DeckLink) and AJA cards, used both for capture and
    as outputs; Epiphan, Magewell, Inogeni and GigE cameras are also listed for capture.
  confidence: verified
- protocol: ltc
  direction: in
  note: LTC over an audio input; supported framerates are 24, 25, 29.97 DF and 30. Millumin also ships
    a free TimecodeClock app that generates LTC, MTC or its own network timecode.
  confidence: verified
- protocol: mtc
  direction: in
  note: MTC over MIDI, same framerate list as LTC.
  confidence: verified
