  label: Millumin Help
status: current
typical_use:
- Video and projection playback for theatre and dance, cued column by column
- Projection mapping and soft-edge blending across multiple projectors from one Mac
- Taking GO from a lighting console or QLab over MSC or OSC
- Driving DMX fixtures from the same show file as the video, via Light Plot
- Live camera or NDI input processed and re-projected in the same document
gotchas:
- Art-Net universes are numbered from 0 but sACN universes from 1 in Millumin's own docs. Repatch
  the same rig between the two protocols and everything lands one universe out.
- When the 30-day trial lapses Millumin still opens, saves, plays and exposes every feature. The only
  change is a watermark on the outputs. Nothing else tells you the licence has run out.
- Vendor docs quote 60-120 ms latency on Blackmagic capture cards. Live camera composited against
  audio or a moving performer will need that budgeted for, not discovered in the tech.
- 'Output count is a chip choice, not a GPU-speed choice: docs note base M1/M2/M3 Macs drive one external
  display, while M-series Max parts go to five. Buy the machine by display count.'
- Licences are sold as lifetime (with paid upgrades between major versions) or as 7-day, 30-day and
  1-year rentals; each licence has a seat count and machines must be deactivated before being moved.
confidence: verified
