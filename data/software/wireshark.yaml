id: wireshark
name: Wireshark
aka:
- Ethereal
vendor: Wireshark Foundation
category: monitoring-diagnostics
summary: General-purpose packet analyzer with built-in dissectors for Art-Net, ACN/sACN (E1.31), RDM,
  RDMnet, and OSC, making it a de facto low-level protocol sniffer for lighting/AV networks.
license: GPL-2.0
price_model: free
platforms:
- windows
- macos
- linux
speaks:
- protocol: art-net
  direction: in
  confidence: verified
  note: Native artnet dissector present since very early Wireshark releases (display filter fields documented
    back to version 1.0.0).
- protocol: sacn
  direction: in
  confidence: verified
  note: Dissected via the ACN dissector's 'Streaming DMX' (E1.31) option, which must be enabled in Preferences
    > Protocols > ACN.
- protocol: acn
  direction: in
  confidence: verified
  note: Dissects the underlying ACN/E1.17 root layer (Root Layer, SDT, wrappers) that sACN rides on.
- protocol: rdm
  direction: in
  confidence: verified
  note: E1.20 RDM dissector; base fields since Wireshark 1.8.0, extended fields since 3.4.0.
- protocol: rdmnet
  direction: in
  confidence: verified
  note: RDMnet dissector added in Wireshark 3.4.0 (commit 'Added RDMnet protocol', March 2020).
- protocol: osc
  direction: in
  confidence: verified
  note: Open Sound Control dissector, documented display filter fields since Wireshark 1.12.0.
- protocol: mdns-dns-sd
  direction: in
  note: Decodes mDNS, the fastest way to prove a discovery problem.
  confidence: reported
- protocol: snmp
  direction: in
  note: Decodes SNMP.
  confidence: unverified
- protocol: srt
  direction: in
  note: SRT dissector in current builds.
  confidence: unverified

homepage:
  url: https://www.wireshark.org/
repo:
  url: https://github.com/wireshark/wireshark
docs:
  url: https://www.wireshark.org/docs/dfref/a/artnet.html
status: current
typical_use:
- Confirm whether sACN/Art-Net packets are actually reaching a node's NIC
- Diagnose sACN priority conflicts by inspecting per-address priority (start code 0xDD) vs level (0x00)
  packets
- Verify RDM/RDMnet discovery and GET/SET transactions between controller and responder
- Capture and archive a show's network traffic for post-mortem analysis after a failure
gotchas:
- sACN ('Streaming DMX') dissection is off by default; enable it in Edit > Preferences > Protocols > ACN
  or universes show up undissected.
- Wireshark only shows what's on the wire, it does not judge whether DMX/sACN data is 'correct' — you
  must manually expand fields to tell level packets (start code 0x00) from per-address priority packets
  (0xDD).
- 'The Art-Net dissector is missing most Art-Net 4 fields introduced from protocol document revision 1.4DA
  onward (open bug, GitLab issue #18293).'
- 'The ACN/sACN dissector does not fully dissect Universe Discovery or Universe Sync packets in some releases
  (GitLab issues #18755, #18767).'
confidence: verified
tags:
- packet-capture
- protocol-analyzer
- network-troubleshooting
