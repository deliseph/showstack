gotchas:
- 'A virtual production volume is a synchronised system: engine frame rate, genlock, camera
  shutter and LED processor all have to agree, and any one of them being wrong looks like
  a content fault.'
- nDisplay clusters need identical machines and configuration. A mismatched node is not a
  degraded node, it is a visibly wrong one.
- Project size and build times make last-minute changes expensive. Treat content freeze the
  way a broadcast production would.
