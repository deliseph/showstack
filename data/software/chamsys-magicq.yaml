status: current
typical_use:
- Free full-function lighting control for schools, churches and small venues
- Touring and festival control on MagicQ consoles
- Offline programming and previs against Capture over CITP
- Merging or capturing incoming Art-Net/sACN/Pathport from another desk
gotchas:
- MagicDMX Basic and Full do not unlock anything. With only a MagicDMX attached the software stays
  in demo mode, and MagicDMX Basic is additionally limited to 5-hour sessions.
- Timecode, MIDI and OSC are all Unlocked-mode features. Free MagicQ will run 64 universes of Art-Net
  all day but will not chase LTC.
- 'There are three tiers, not two: Demo, Core and Unlocked. Core (GeNetix GN2, SnakeSys, audio interface)
  buys scheduled events, the remote app and the web server, but not timecode or OSC.'
- The tier follows the connected device, so losing the wing or dongle mid-run silently drops the rig
  to demo-mode features.
- Linux builds are limited to current Ubuntu LTS releases on 64-bit x86. There is no ARM build.
- The tier structure was reworked from v1.9.5.0 onwards, so older forum advice about what a given
  dongle unlocks may no longer match.
confidence: verified
