status: current
typical_use:
- Main lighting control for plays, musicals and opera
- Offline programming and paperwork on a laptop before the fit-up
- Backup, mirror or remote programming station inside an Eos network
- Small rigs run from Nomad plus a Gadget II or a Net3 gateway
gotchas:
- The free Eos download outputs nothing. Without an ETCnomad USB key it runs only as an offline editor
  or in mirror mode.
- ETC counts outputs (addresses), not universes. A base ETCnomad key is 1,024 outputs, which is two
  universes of 512; the unlocked key is 6,144.
- From v2.6.0/v8.0.0 a dongle has only two possible counts, base and unlocked. The old ladder of 256/512/1536/2560
  and so on is gone.
- Eos v3.2.0 and later, Apex consoles, Windows 10 consoles and all ETCnomad devices dropped Net2 (EDMX)
  and AVAB UDP output. A house with legacy ETCNet2 nodes has to move to sACN or Art-Net.
- Element's output count is fixed at 1,024 and cannot be upgraded. Element 2 goes from 1,024 base
  to 6,144 unlocked.
- RDM Device Discovery is disabled by default, and switches itself off again as soon as you leave
  the Patch display.
- Art-Net is disabled by default in Patch, so a visualiser or node expecting Art-Net sees nothing
  until the protocol is enabled.
confidence: verified
