id: eos-family
name: Eos
aka:
- Eos family
- ETCnomad
- Nomad
- Eos Apex
- Ion Xe
- Gio
- Element
vendor: Electronic Theatre Controls (ETC)
category: lighting-control
summary: 'ETC''s lighting control software for the Eos family: the same code runs on Apex, Gio, Ion
  Xe and Element consoles and on a Windows or Mac laptop as ETCnomad. The dominant console platform
  in English-language theatre.'
license: proprietary
price_model: dongle-locked
platforms:
- windows
- macos
speaks:
- protocol: sacn
  direction: bidirectional
  note: Enabled by default in Patch, universes 1-63,999. Incoming sACN levels can also be used as
    a show control trigger.
  confidence: verified
- protocol: art-net
  direction: out
  note: Disabled by default in Patch. Art-Net universes 0-255.
  confidence: verified
- protocol: dmx512
  direction: out
  note: Local DMX ports on consoles, or an ETC Gadget/Gadget II USB to DMX-RDM converter on a PC or
    Mac. Up to four Gadgets per computer.
  confidence: verified
- protocol: rdm
  direction: bidirectional
  note: Device discovery from the Patch display. Network RDM requires an ETC Net3 or Response Mk2
    gateway with RDM enabled on the DMX ports, running gateway software 5.1 or newer.
  confidence: verified
- protocol: osc
  direction: bidirectional
  since_version: '2.3'
  note: ETC states all Eos family devices can send and receive OSC when running software v2.3 or higher.
  confidence: verified
- protocol: midi-show-control
  direction: bidirectional
  note: Local MIDI connections on Eos Ti and Gio; Gio @5 and Ion Xe use USB; other consoles need a
    Net3 Show Control Gateway.
  confidence: verified
- protocol: midi
  direction: bidirectional
  note: Raw MIDI can be sent and received. MIDI notes are output only, and cannot be received by a
    Net3 Show Control Gateway.
  confidence: verified
- protocol: mtc
  direction: in
  note: MIDI timecode is receive only, locally or via a Show Control Gateway.
  confidence: verified
- protocol: ltc
  direction: in
  note: SMPTE/LTC timecode is receive only and arrives via a Net3 Show Control Gateway.
  confidence: verified
- protocol: 0-10v
  direction: in
  note: 0-10 VDC analogue inputs and contact closures. Four local closures on Ti/Gio/Ion, more via
    a Net3 I/O Gateway.
  confidence: verified
