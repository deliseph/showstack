id: midi-ox
name: MIDI-OX
category: monitoring-diagnostics
summary: Long-running Windows MIDI diagnostic utility and real-time stream monitor with a SysEx librarian,
  used by show-control technicians to inspect raw MIDI traffic including MIDI Time Code and Show Control
  messages.
license: proprietary
price_model: free
platforms:
- windows
speaks:
- protocol: mtc
  direction: in
  confidence: reported
  note: Recommended on ControlBooth (theatre-tech forum) by author John Huntington for displaying MIDI
    Time Code readouts.
- protocol: midi-show-control
  direction: in
  confidence: unverified
  note: Generic real-time MIDI monitor; will show raw MSC SysEx bytes on the wire but has no dedicated
    MSC command decoder.
homepage:
  url: https://midiox.org/
status: historical
typical_use:
- Watch raw MIDI messages (notes, SysEx, real-time) flowing between a console and a show-control cue system
- Read a large-format MIDI Time Code display for backstage cueing reference
- Back up (dump/restore) a device's SysEx patch data via the built-in librarian
gotchas:
- The original midiox.com site was compromised and now redirects to an unsafe page; get it from the midiox.org
  mirror instead.
- Development effectively stopped around 2017 at v7.0.2 — it is a preserved legacy tool, not actively
  updated.
confidence: reported
tags:
- midi
- mtc
- windows
- legacy
