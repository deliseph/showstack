  label: Rational Acoustics
gotchas:
- The measurement microphone position is the measurement. Two engineers measuring the same
  system three metres apart get different, equally correct answers.
- Transfer function needs a genuine reference feed of the same signal. A reference taken after
  processing measures nothing useful about that processing.
- Coherence is the honesty indicator. Low coherence means the data in that band should not
  be acted on, however convincing the trace looks.
