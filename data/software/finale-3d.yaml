typical_use:
- Pyromusical design and simulation
- Producing the script a firing system executes
- Showing a client the show before anything is bought
gotchas:
- The simulation is only as honest as the effect data behind it. Times, heights and durations come
  from the product library and from the manufacturer.
- Design software does not arm anything. Permission to fire stays in the physical chain, outside
  every computer.
