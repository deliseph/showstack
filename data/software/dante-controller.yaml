gotchas:
- Device names are the patch. Renaming a device breaks every subscription that referenced
  the old name, which is why naming happens before programming, not after.
- The clock status tab is the first place to look for ticks and dropouts, not the audio path.
  One device set as preferred master while another insists on being master is the classic
  cause.
- Latency is set per device and the network must accommodate the highest. A single device
  left at 0.15 ms on a multi-switch network will drop audio while everything else looks fine.
