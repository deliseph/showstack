id: esp-vision
name: ESP Vision
aka:
  - Vision Pro
vendor: ESP Studios / Zzyzx, Inc. (acquired by Vectorworks, Inc., 2015)
category: previsualisation
summary: >-
  Realtime DMX-driven lighting visualiser sold independently from the mid-2000s
  until Vectorworks acquired the product and its team in 2015. Its technology
  became the basis for what Vectorworks now sells as Vectorworks Vision.

license: proprietary
price_model: one-off-purchase

speaks:
  - protocol: art-net
    direction: in
    note: >-
      Documented DMX input protocol in the ESP Vision 2.0 era (2006); not
      necessarily reflective of every release across the product's life.
    confidence: reported

status: superseded
superseded_by: vectorworks-vision
typical_use:
  - Realtime lighting simulation for touring, broadcast, corporate and theatrical shows, circa 2004-2015
  - Offline programming against consoles including Wholehog 3, HogPC and grandMA (via MA-Net)

gotchas:
  - >-
    Acquired by Vectorworks, Inc. in October 2015. ESP Vision's technical team
    joined Vectorworks' development group and its previsualisation technology
    became the basis for Vectorworks Vision; "ESP Vision" has not been sold as an
    independent product since.
  - >-
    Contemporary sources (2004-2006) describe a per-DMX-universe purchase price
    plus a separate per-universe annual subscription covering upgrades and support.
    These figures predate the 2015 acquisition by roughly a decade and should not
    be assumed current.

confidence: reported
tags:
  - previsualisation
  - lighting
  - visualiser
  - vectorworks

