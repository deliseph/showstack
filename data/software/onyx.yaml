status: current
typical_use:
- Club, corporate and touring lighting control on NX consoles
- Free single-universe PC control for small rigs and learning
- Pixel mapping and media control with DyLOS
- Offline programming for an NX console show file
gotchas:
- The tier is set by whichever Obsidian device is plugged in, not by a software key file. FREE is
  universe 1 only; NOVA and NOVA+ give universes 1-4; the 8/16/32/64/128 tiers need the matching ONYX
  key or NX wing.
- OSC, MIDI and all timecode protocols are locked in FREE and NOVA mode. NOVA+ (NX-Touch, NX-K, NX-P)
  is the first tier where they are fully enabled; below that you only get time-limited trials.
- DyLOS is limited to 2 zones below the Onyx 16 tier, and extra zones render with a watermark.
- ONYX never sends MIDI out. It does not generate MIDI messages, only passes them along, so anything
  downstream needing MIDI cues needs another device.
- Legacy M-Series USB products stopped working under Windows 11 24H2 because of driver security changes,
  and legacy Martin keys (Maxxyz, M1, Ether2DMX8) are no longer recognised to unlock ONYX.
- Windows only, Windows 10/11 64-bit. There is no macOS build.
- 255 universe slots are patchable but DMX processing is capped at up to 128 universes depending on
  licence, so patching a universe is not the same as outputting it.
confidence: verified
