id: onyx
name: ONYX
aka:
- Obsidian ONYX
- Onyx
vendor: Obsidian Control Systems
category: lighting-control
summary: Obsidian Control Systems' Windows lighting control software, running on NX consoles and on
  any PC, carrying forward the Martin M-Series/M-PC licence lineage. The free tier outputs one universe;
  everything above that unlocks by plugging in Obsidian hardware.
license: proprietary
price_model: freemium
platforms:
- windows
speaks:
- protocol: art-net
  direction: bidirectional
  note: Each Art-Net universe can be set to output, input or both. Detected nodes are unicast their
    assigned universes, with an optional broadcast mode. Art-Net timecode can also be received.
  confidence: verified
- protocol: sacn
  direction: bidirectional
  note: Can be set to output, input or both, with a settable sACN priority in the 0-200 range.
  confidence: verified
- protocol: dmx512
  direction: out
  requires_licence: true
  note: Direct DMX needs Obsidian USB hardware (NX-DMX, NX-Touch, NX-K, NX-P) or an NX console. Onyx
    USB output appears from the NOVA tier upwards, not in ONYX FREE.
  confidence: reported
- protocol: citp
  direction: in
  note: Media server thumbnails are pushed across the network into ONYX's parameter belts, and patch
    can be imported from compatible visualisers. Servers on the network are auto-detected.
  confidence: verified
- protocol: osc
  direction: in
  requires_licence: true
  note: Full control of main playbacks, playback buttons, F-keys and command keys. OSC is locked in
    FREE and NOVA mode; a free trial can be started from the licensing options.
  confidence: verified
- protocol: midi
  direction: in
  requires_licence: true
  note: MIDI notes and commands trigger Go, Pause, Release, Flash and similar. ONYX does not generate
    MIDI messages, it only passes them along. Fully enabled from the NOVA+ tier.
  confidence: verified
- protocol: midi-show-control
  direction: in
  requires_licence: true
  note: MSC format and device ID are set in I/O settings. Gated behind the same tier as MIDI and timecode.
  confidence: reported
- protocol: ltc
  direction: in
  requires_licence: true
  note: LTC via the SMPTE IN 3-pin connector on M6+ consoles, or audio LTC via an audio interface.
    Timecode is only fully enabled from the NOVA+ tier.
  confidence: verified
- protocol: mtc
  direction: in
  requires_licence: true
  note: MIDI timecode via MIDI ports or the SMPTE IN connector. Only fully enabled from the NOVA+
    tier.
  confidence: verified
