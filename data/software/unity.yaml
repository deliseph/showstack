summary: >-
  Real-time engine that dominates XR work. If a project involves headsets, handheld AR or an interactive
  exhibit on modest hardware, the device SDK you need almost certainly exists for Unity first. Scripted
  in C#, lighter to start with than Unreal, and less turnkey for camera-tracked broadcast and LED
  volume work.
