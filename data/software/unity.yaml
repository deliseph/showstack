gotchas:
- Licence tiers and their terms have changed more than once. Confirm what applies to your seat and
  your revenue before committing a long project.
- Show-specific plumbing — timecode, Art-Net, tracking — is community-supplied more often than it
  is first-party. Check maintenance before depending on a package.
