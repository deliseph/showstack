typical_use:
- Long-running installations where licensing must not be a failure mode
- Embedded audio and control on small computers
- Teaching dataflow without a purchase
gotchas:
- The interface is spare and the documentation assumes you already know the model. Worth learning
  alongside Max rather than instead of it.
- Externals vary in maintenance. Freeze the exact set a piece depends on and archive them with the
  patch.
