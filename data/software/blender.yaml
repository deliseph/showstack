gotchas:
- Render output has to match the screen geometry exactly. Content rendered at the wrong aspect
  or pixel pitch is the single most common reason a wall looks wrong on site.
- Version changes can alter render results. Pin the Blender version for a project the way
  you would pin a media server version.
